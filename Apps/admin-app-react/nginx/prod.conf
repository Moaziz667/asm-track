# Environnement SERVEUR — TLS obligatoire.
#
# Monté par docker-compose.prod.yml par-dessus la configuration locale cuite dans l'image. Il n'y a
# donc rien à reconstruire pour ajuster le proxy sur le serveur, et surtout : cette configuration
# vit dans le dépôt. Elle n'a longtemps existé que sur la machine distante, où le prochain
# déploiement l'aurait effacée sans laisser de trace.
#
# Pourquoi TLS n'est pas optionnel ici : le navigateur réserve crypto.subtle aux origines sécurisées,
# et localhost est la seule exception. Servie sur une IP en clair, la page se charge mais la
# connexion échoue sur « crypto.subtle is available only in secure contexts ».

# Tout le trafic en clair est redirigé. Aucune ressource n'est servie sur ce port.
server {
    listen 8080;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    # 8443, pas 443 : l'image tourne sans privilèges et ne peut pas lier un port sous 1024.
    # Le compose publie 443 → 8443.
    listen 8443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Monté en lecture seule depuis ./certs (voir docker-compose.prod.yml). La clé privée doit
    # appartenir à l'UID 101 et n'être lisible que par lui — sinon nginx refuse de démarrer sur un
    # « cannot load certificate key … Permission denied ». Voir certs/README.md.
    ssl_certificate     /etc/nginx/certs/asm-track.crt;
    ssl_certificate_key /etc/nginx/certs/asm-track.key;

    # Port vu par le navigateur : le conteneur écoute sur 8443, mais il est publié sur 443. Sans
    # cette valeur, Keycloak fabriquait ses URLs en https://…:8443/auth/ et le navigateur tombait
    # sur ERR_CONNECTION_REFUSED — 8443 n'existe pas côté hôte.
    set $fwd_port 443;

    include /etc/nginx/locations.conf;
}
