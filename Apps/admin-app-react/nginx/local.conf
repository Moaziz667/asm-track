# Environnement LOCAL — HTTP simple, pas de TLS.
#
# C'est la configuration cuite dans l'image (voir Dockerfile). Le VPS la remplace au montage par
# prod.conf, sans reconstruire quoi que ce soit.
#
# Pourquoi pas de HTTPS ici : sur localhost le navigateur considère l'origine comme sécurisée, donc
# crypto.subtle et l'authentification OIDC fonctionnent en clair. Cette faveur ne vaut que pour
# localhost — dès qu'on passe par une adresse IP, il faut du TLS. D'où prod.conf.

server {
    # 8080, not 80: the image runs unprivileged and cannot bind a port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Port vu par le navigateur : le conteneur écoute sur 8080, mais il est publié sur 80.
    set $fwd_port 80;

    include /etc/nginx/locations.conf;
}
