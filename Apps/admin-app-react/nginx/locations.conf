# Routes partagées par les deux environnements.
#
# Ce fichier n'est PAS dans conf.d/ : il ne contient que des blocs `location`, qui n'ont de sens
# qu'à l'intérieur d'un `server`. nginx charge conf.d/*.conf comme configuration de premier niveau
# et refuserait de démarrer. Il est donc inclus explicitement par local.conf et par prod.conf.
#
# Tout ce qui distingue les deux environnements — port d'écoute, TLS, redirection — vit dans ces
# deux fichiers. Ce qui est commun vit ici, en un seul exemplaire : une route ajoutée profite aux
# deux, et aucune ne peut plus manquer d'un côté. C'est exactement ainsi que /files avait disparu.

# REST API → API gateway (internal docker network). Keeps the browser
# same-origin so cookie auth works and there is no CORS preflight.
location /api/ {
    proxy_pass http://api-gateway:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Keycloak → même origine, sous /auth.
#
# proxy_pass SANS barre finale : le préfixe /auth est conservé et transmis tel quel. Keycloak
# tourne lui-même sous ce chemin (KC_HTTP_RELATIVE_PATH), donc les deux côtés s'accordent. Avec
# une barre finale, nginx retirerait le préfixe et Keycloak générerait des URLs sans /auth — page
# de connexion et document de découverte OIDC cassés dès la première redirection.
#
# Ce que ce bloc achète : l'image du SPA ne contient plus l'adresse d'un environnement, le port
# 8089 disparaît de la surface exposée, et le navigateur ne quitte jamais l'origine.
location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Le port vu par le navigateur, que nginx ne peut pas deviner : il écoute sur 8080/8443 à
    # l'intérieur du conteneur mais est publié sur 80/443. Sans cet en-tête, Keycloak fabrique ses
    # URLs avec le port interne et le navigateur reçoit un ERR_CONNECTION_REFUSED.
    # Chaque fichier d'environnement pose sa valeur.
    proxy_set_header X-Forwarded-Port $fwd_port;
    # Les en-têtes de la page de connexion grossissent avec l'état OIDC et le thème. Les tampons
    # par défaut débordent, et cela se traduit par un 502 sans message exploitable.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
}

# Fichiers MinIO → passerelle, qui porte la route /files/** et retire le préfixe.
#
# Ne PAS proxifier directement vers minio:9000 : les URLs sont signées et la signature couvre
# l'en-tête Host. C'est la passerelle qui le réécrit vers celui de MinIO, exactement ce contre
# quoi la signature a été calculée. Un raccourci vers MinIO ferait échouer toutes les images.
#
# Sans ce bloc, /files tombe dans le try_files final et le navigateur reçoit index.html à la place
# d'une image : la passerelle a cessé de publier le port 80, et rien ne l'avait remplacée ici.
location /files/ {
    proxy_pass http://api-gateway:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# STOMP/SockJS realtime → gateway (needs HTTP/1.1 upgrade for websockets).
location /ws {
    proxy_pass http://api-gateway:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
}

# SPA client-side routing fallback.
location / {
    try_files $uri $uri/ /index.html;
}
