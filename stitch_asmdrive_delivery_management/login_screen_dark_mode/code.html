<input class="w-full bg-background border border-zinc-800 text-on-surface py-3 pl-12 pr-4 rounded-md focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none placeholder:text-zinc-700" placeholder="operator@asmdrive.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-outline uppercase tracking-wider block">Password</label>

</div>

<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center space-x-sm pt-xs">
<input class="w-4 h-4 rounded bg-background border-zinc-800 text-primary focus:ring-offset-background focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">Remember this device</label>
</div>
<div class="pt-md">
<button class="w-full bg-primary-container hover:bg-secondary-container text-white font-bold py-4 rounded-md shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-all" type="submit">
<span class="tracking-[0.2em] uppercase font-headline-md text-[16px]">LOGIN</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
