<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .loading-bar-animation {
            width: 100%;
            height: 4px;
            background: #e2e2e8;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-animation::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: #00113a;
            animation: progress 1.5s infinite linear;
        }
        @keyframes progress {
            0% { left: -50%; }
            100% { left: 100%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md antialiased overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative flex flex-col items-center justify-center min-h-screen w-full bg-white px-margin-mobile">
<!-- Top Visual Accent (Subtle Tonal Layer) -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<!-- Brand Identity Section -->
<section class="flex flex-col items-center justify-center space-y-stack-lg max-w-md w-full">
<!-- Hero Brand Asset -->
<div class="mb-stack-lg flex items-center justify-center">
<!-- Branding using exact strings from JSON instructions -->
<div class="flex flex-col items-center">
<div class="p-stack-md bg-white border-2 border-primary mb-stack-sm rounded-none">
<span class="material-symbols-outlined text-primary text-6xl" data-icon="local_shipping">local_shipping</span>
</div>
<h1 class="font-h1 text-h1 text-primary tracking-wider uppercase font-black">AsmDrive</h1>
</div>
</div>
<!-- Loading & Auth State Section -->
<div class="w-full space-y-stack-md">
<!-- Status List (Utilitarian) -->
<div class="flex flex-col space-y-stack-sm w-full border-t border-b border-outline-variant py-stack-md">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-secondary uppercase">Connecting to Satellite</span>
<span class="material-symbols-outlined text-primary text-sm" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-secondary uppercase">Checking Driver Auth</span>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
</div>
<div class="flex items-center justify-between opacity-40">
<span class="font-label-caps text-label-caps text-secondary uppercase">Fetching Route Data</span>
<span class="material-symbols-outlined text-sm" data-icon="pending">pending</span>
</div>
</div>
<!-- Custom Professional Loading Bar -->
<div class="loading-bar-animation"></div>
<p class="font-body-md text-body-md text-center text-on-surface-variant">
                    Initializing secure logistics environment...
                </p>
</div>
</section>
<!-- Bottom Footer Info -->
<footer class="absolute bottom-12 w-full text-center px-margin-mobile">
<div class="flex flex-col items-center space-y-stack-sm">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest">Version 4.2.0-Production</span>
<div class="flex space-x-gutter">
<div class="w-12 h-1 bg-primary-container"></div>
<div class="w-12 h-1 bg-outline-variant"></div>
<div class="w-12 h-1 bg-outline-variant"></div>
</div>
</div>
