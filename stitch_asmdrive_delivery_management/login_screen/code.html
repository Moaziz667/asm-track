            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center justify-center">
<!-- Login Container -->
<main class="w-full max-w-md px-margin-mobile flex flex-col gap-stack-lg">
<!-- Branding Anchor -->
<header class="flex flex-col items-center gap-stack-sm mb-stack-lg">
<div class="h-16 w-16 bg-primary flex items-center justify-center rounded-lg mb-stack-sm">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="local_shipping">local_shipping</span>
</div>
<!-- Casing Integrity: AsmDrive -->
<h1 class="text-xl font-black text-primary uppercase tracking-wider font-h1">AsmDrive</h1>
<p class="font-body-md text-secondary">Logistics &amp; Fleet Management</p>
</header>
<!-- Login Form -->
<div class="bg-surface-container-lowest border border-outline-variant p-stack-lg flex flex-col gap-stack-md">
<div class="flex flex-col gap-1">
<h2 class="font-h2 text-h2 text-on-surface">Sign In</h2>
<p class="font-body-md text-on-surface-variant">Enter your credentials to access your routes.</p>
</div>
<form class="flex flex-col gap-stack-md">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-primary uppercase" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-touch-target-min px-stack-md border-2 border-outline bg-white focus:border-primary focus:ring-0 transition-all outline-none" id="email" name="email" placeholder="driver@asmdrive.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-primary uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-touch-target-min px-stack-md border-2 border-outline bg-white focus:border-primary focus:ring-0 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me (Utility) -->
<div class="flex items-center gap-stack-sm py-2">
<input class="w-5 h-5 rounded-none border-2 border-outline text-primary focus:ring-primary" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-on-surface" for="remember">Remember this device</label>
</div>
<!-- Login Action -->
<button class="w-full h-touch-target-min bg-primary text-on-primary font-bold uppercase tracking-widest hover:bg-primary-container active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-stack-sm mt-stack-sm" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Footer / Support Info -->
<footer class="flex flex-col items-center gap-stack-sm">
<p class="font-body-md text-secondary">Need help accessing your account?</p>
<div class="flex gap-stack-md">
<a class="flex items-center gap-1 font-label-caps text-label-caps text-primary" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="support_agent">support_agent</span>
                    Contact Support
                </a>
<span class="text-outline-variant">|</span>
<a class="flex items-center gap-1 font-label-caps text-label-caps text-primary" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="language">language</span>
                    English
                </a>
</div>
</footer>
</main>
<!-- Background Decorative Image (Subtle Texture) -->
<div class="fixed inset-0 -z-10 opacity-5 pointer-events-none">
<img alt="" class="w-full h-full object-cover grayscale" data-alt="Monochrome aerial view of a massive logistics distribution center with semi-trucks parked in neat rows under overcast sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBc-Y8tf-PSN15Gzs-2LLIWX0JogNvpFYw9uO62FRxmOxkD9i3fAvcaOsX-SNQ6JyAN9HVfJWF9CfmHpe9bsiDDvj2RSCKliGJvbrGrOkZMt4uxG4USiWGwpcUawX9C2JDHCZoebmYpyVwWTtltFRXyMM4vAZN988iETZ7MAvSKDgvAn44TABVcCGwRvER8OvdhhcKh6RPCADE_EgchWPmIoqLMC7Vmfq_2THPwarIo_-NC-Z9weX0gjwoHkSGX5QdkO96Ov4AWC5lM"/>
