# ASM Track — CI pipeline (self-hosted GitLab, git.asmtechtn.com).
#
# Runs on the Docker-executor runner (tag: docker). Stages follow the test pyramid / fail-fast order:
#   1. build            — compile backend + type-check frontend (catches breakage cheapest, first)
#   2. unit-test        — fast, fully-mocked tests, no external services
#   3. integration-test — slower; needs a real Postgres (attached as a `services:` side-car)
#
# Nothing in a later stage runs if an earlier stage fails.

stages:
  - build
  - unit-test
  - integration-test

variables:
  # No Gradle daemon in CI (one-shot JVM), and keep its home in the project dir so it can be cached.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# ── reusable snippets ────────────────────────────────────────────────────────
.gradle-delivery: &gradle-delivery
  image: gradle:8.5-jdk17
  tags: [docker]
  cache:
    key: gradle-delivery
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - cd Microservices/DeliveryMicroservice

.gradle-erp-adapter: &gradle-erp-adapter
  image: gradle:8.5-jdk17
  tags: [docker]
  cache:
    key: gradle-erp-adapter
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - cd Microservices/ErpAdapterService

.npm-admin: &npm-admin
  image: node:20
  tags: [docker]
  cache:
    key: npm-admin
    paths:
      - Apps/admin-app-react/.npm
  before_script:
    # `npm ci` reinstalls from package-lock so the native (rolldown) binding matches the Linux runner —
    # never reuse a node_modules built on another OS.
    - cd Apps/admin-app-react
    - npm ci --cache .npm --prefer-offline

# ── 1. BUILD ─────────────────────────────────────────────────────────────────
build-backend-delivery:
  <<: *gradle-delivery
  stage: build
  script:
    - gradle compileJava compileTestJava

build-backend-erp-adapter:
  <<: *gradle-erp-adapter
  stage: build
  script:
    - gradle compileJava compileTestJava

typecheck-admin:
  <<: *npm-admin
  stage: build
  script:
    - npm run typecheck

# ── 2. UNIT TEST ─────────────────────────────────────────────────────────────
# `test` runs unit tests only (integration *IT excluded in build.gradle) — no DB needed.
unit-test-backend-delivery:
  <<: *gradle-delivery
  stage: unit-test
  script:
    - gradle test
  artifacts:
    when: always
    reports:
      junit: Microservices/DeliveryMicroservice/build/test-results/test/*.xml
    expire_in: 1 week

unit-test-backend-erp-adapter:
  <<: *gradle-erp-adapter
  stage: unit-test
  script:
    - gradle test
  artifacts:
    when: always
    reports:
      junit: Microservices/ErpAdapterService/build/test-results/test/*.xml
    expire_in: 1 week

test-admin:
  <<: *npm-admin
  stage: unit-test
  script:
    - npm test

# ── 3. INTEGRATION TEST ──────────────────────────────────────────────────────
# `integrationTest` runs the *IT suite against the side-car Postgres (via IT_DB_URL). No Docker-in-Docker:
# the tests connect to the service over the job network, they don't spawn their own container.
integration-test-backend-delivery:
  <<: *gradle-delivery
  stage: integration-test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    POSTGRES_DB: delivery_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    IT_DB_URL: "jdbc:postgresql://postgres:5432/delivery_test"
    IT_DB_USER: test
    IT_DB_PASS: test
  before_script:
    - cd Microservices/DeliveryMicroservice
    - until bash -c "echo > /dev/tcp/postgres/5432" 2>/dev/null; do sleep 1; done
  script:
    - gradle integrationTest
  artifacts:
    when: always
    reports:
      junit: Microservices/DeliveryMicroservice/build/test-results/integrationTest/*.xml
    paths:
      - Microservices/DeliveryMicroservice/build/reports/tests/
    expire_in: 1 week

# ── 3b. ERP ADAPTER — Odoo integration tests, two versions ───────────────────
# The suite already targets both ends of the supported range (V16 and V19): if the connector
# holds on the oldest and the newest, the versions between are covered by construction. What
# it never had was a place to run — the job used to be `when: manual` with `allow_failure`,
# which is a test nobody runs and a failure nobody sees.
#
# Side-cars instead of Docker-in-Docker: the runner is not privileged, and `services:` needs
# no special rights. Two Odoo instances share one Postgres, each with its own database.
#
# Scheduled only. Odoo initialises `sale` + `stock` on first boot, which costs minutes — too
# slow to sit in front of every push, and the connector does not change on every push either.
# Set it up under CI/CD → Schedules (nightly is enough).
integration-test-erp-adapter-odoo:
  stage: integration-test
  tags: [docker]
  image: gradle:8.5-jdk17
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"      # still runnable on demand from the UI
  services:
    - name: postgres:16
      alias: odoo-db
    # `command` makes each instance create and populate its own database before serving. Without
    # it Odoo comes up on the database manager screen and every test fails on authentication.
    - name: odoo:16
      alias: odoo16
      command: ["odoo", "-d", "odoo16", "-i", "base,sale,stock", "--without-demo=all",
                "--db_host=odoo-db", "--db_user=odoo", "--db_password=odoo"]
    - name: odoo:19
      alias: odoo19
      command: ["odoo", "-d", "odoo19", "-i", "base,sale,stock", "--without-demo=all",
                "--db_host=odoo-db", "--db_user=odoo", "--db_password=odoo"]
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    POSTGRES_USER: odoo
    POSTGRES_PASSWORD: odoo
    POSTGRES_HOST_AUTH_METHOD: trust
    # The tests default to localhost:8069 / :8070 to match the local docker-compose. In CI the
    # side-cars answer to their alias, so both are redirected here — no test code knows it is
    # running in CI.
    ODOO_V16_URL: "http://odoo16:8069/jsonrpc"
    ODOO_V16_DB: odoo16
    ODOO_V19_URL: "http://odoo19:8069/jsonrpc"
    ODOO_V19_DB: odoo19
  before_script:
    - cd Microservices/ErpAdapterService
    # Services all start at once, with no ordering and no health gate, so Odoo may well reach a
    # Postgres that is not listening yet. Waiting on the HTTP endpoint covers both: it only
    # answers once Odoo has finished creating its database.
    - |
      for host in odoo16 odoo19; do
        echo "waiting for $host"
        for i in $(seq 1 120); do
          wget -q --spider "http://$host:8069/web/login" 2>/dev/null && { echo "$host ready"; break; }
          [ "$i" = 120 ] && { echo "$host never came up"; exit 1; }
          sleep 5
        done
      done
  script:
    - gradle integrationTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: Microservices/ErpAdapterService/build/test-results/integrationTest/*.xml
    paths:
      - Microservices/ErpAdapterService/build/reports/tests/
    expire_in: 1 week
