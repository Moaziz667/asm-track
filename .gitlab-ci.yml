# ASM Track — CI pipeline (self-hosted GitLab, git.asmtechtn.com).
#
# Runs on the Docker-executor runner (tag: docker). Stages follow the test pyramid / fail-fast
# order, so the cheapest check that can fail runs first:
#   1. build            — compile every service, type-check and lint the frontend
#   2. unit-test        — fast, fully-mocked, no external services
#   3. integration-test — slower; needs a real Postgres, and a real Odoo for the connector
#   4. package          — build and push versioned images to the project registry
#   5. deploy           — tire ces images sur le VPS. Manuel, jamais automatique.
#
# Nothing in a later stage runs if an earlier stage fails.

stages:
  - build
  - unit-test
  - security
  - integration-test
  - package
  - deploy

variables:
  # No Gradle daemon in CI (one-shot JVM), and keep its home in the project dir so it can be cached.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# ── reusable snippets ────────────────────────────────────────────────────────
# One template per toolchain, driven by $SERVICE. Five near-identical job definitions used to
# mean three services were simply forgotten — a matrix cannot forget.
.gradle-service: &gradle-service
  image: gradle:8.5-jdk17
  tags: [docker]
  cache:
    key: "gradle-$SERVICE"
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - cd "Microservices/$SERVICE"

.all-services: &all-services
  matrix:
    - SERVICE: [ApiGateway, AppBackend, DeliveryMicroservice, DriverService, ErpAdapterService, AssistantService]

.npm-admin: &npm-admin
  image: node:20
  tags: [docker]
  cache:
    key: npm-admin
    paths:
      - Apps/admin-app-react/.npm
  before_script:
    # `npm ci` reinstalls from package-lock so the native (rolldown) binding matches the Linux runner —
    # never reuse a node_modules built on another OS.
    - cd Apps/admin-app-react
    - npm ci --cache .npm --prefer-offline

# ── 1. BUILD ─────────────────────────────────────────────────────────────────
build-backend:
  <<: *gradle-service
  stage: build
  parallel: *all-services
  script:
    - gradle compileJava compileTestJava

typecheck-admin:
  <<: *npm-admin
  stage: build
  script:
    - npm run typecheck

lint-admin:
  <<: *npm-admin
  stage: build
  script:
    # Errors fail the job. Warnings are known debt (see eslint.config.js) and the cap stops it
    # growing: the count may fall, never rise.
    - npm run lint:ci
    - npm run check:design

# La gateway possède rbac-policy.json ; un script le recopie verbatim dans les quatre services qui
# l'appliquent (Delivery, Driver, AppBackend, Assistant). L'adaptateur ERP est hors périmètre : il
# ne parle qu'au progiciel du client, jamais à un utilisateur porteur de rôles.
# Rien ne garantissait que les copies concordent — une politique désynchronisée = gateway et service
# n'appliquent pas les mêmes règles d'autorisation. `--check` n'écrit rien et sort 1 sur dérive.
rbac-policy-check:
  stage: build
  image: python:3.12-slim
  tags: [docker]
  script:
    - cd Microservices
    - python sync-rbac-policy.py --check

# ── 2. UNIT TEST ─────────────────────────────────────────────────────────────
# `test` runs unit tests only (integration *IT excluded in build.gradle) — no DB needed.
unit-test-backend:
  <<: *gradle-service
  stage: unit-test
  parallel: *all-services
  script:
    - gradle test
    # Le CSV de JaCoCo porte une ligne par classe ; ses colonnes 4 et 5 sont les instructions
    # manquées et couvertes. On les additionne pour obtenir le taux du service entier. GitLab ne lit
    # pas ce fichier : il relit le journal du job, d'où cet affichage explicite.
    - |
      awk -F, 'NR > 1 { manquees += $4; couvertes += $5 }
               END { printf "Couverture des instructions : %.1f %% (%d sur %d)\n",
                            100 * couvertes / (manquees + couvertes),
                            couvertes, manquees + couvertes }' \
        build/reports/jacoco/test/jacocoTestReport.csv
  # RE2 : aucun groupe capturant n'est autorisé, GitLab retient le premier nombre du texte trouvé.
  # Le libellé ne contient donc volontairement aucun chiffre avant le pourcentage.
  coverage: '/Couverture des instructions : \d+(?:\.\d+)?/'
  artifacts:
    when: always
    reports:
      junit: "Microservices/$SERVICE/build/test-results/test/*.xml"
      # Colore les lignes couvertes et découvertes dans la vue « Changes » d'une demande de fusion.
      coverage_report:
        coverage_format: jacoco
        path: "Microservices/$SERVICE/build/reports/jacoco/test/jacocoTestReport.xml"
    expire_in: 1 week

test-admin:
  <<: *npm-admin
  stage: unit-test
  script:
    # Le rapporteur `junit` est integre a Vitest, aucun paquet a installer. Il est ajoute au
    # rapporteur par defaut plutot que substitue : sans lui, le journal du job ne montrerait plus
    # quel test a echoue, seulement un fichier XML que personne ne lit depuis un runner.
    # Sans ce fichier, l'onglet « Tests » de la pipeline n'agregeait que les couches Java.
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    reports:
      junit: Apps/admin-app-react/junit.xml
    expire_in: 1 week

# ── 2b. SECURITY ─────────────────────────────────────────────────────────────
# Scan de vulnérabilités des dépendances. Trivy lit package-lock.json (npm) et vérifie les Dockerfile,
# et signale HIGH/CRITICAL. Informatif (allow_failure) : une CVE transitive doit être VISIBLE sans
# bloquer la livraison. NB : les services Java n'ont pas de gradle.lockfile — leur scan de dépendances
# se fait au niveau de l'image (voir la note dans docs/exploitation/ci-cd.md).
dependency-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags: [docker]
  allow_failure: true
  variables:
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy-db
    paths:
      - .trivycache
  script:
    - trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress --skip-dirs '**/node_modules' --skip-dirs '**/build' .

# ── 3. INTEGRATION TEST ──────────────────────────────────────────────────────
# `integrationTest` runs the *IT suite against the side-car Postgres (via IT_DB_URL). No Docker-in-Docker:
# the tests connect to the service over the job network, they don't spawn their own container.
integration-test-backend-delivery:
  <<: *gradle-service
  stage: integration-test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    SERVICE: DeliveryMicroservice
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    POSTGRES_DB: delivery_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    IT_DB_URL: "jdbc:postgresql://postgres:5432/delivery_test"
    IT_DB_USER: test
    IT_DB_PASS: test
  before_script:
    - cd Microservices/DeliveryMicroservice
    - until bash -c "echo > /dev/tcp/postgres/5432" 2>/dev/null; do sleep 1; done
  script:
    - gradle integrationTest
  artifacts:
    when: always
    reports:
      junit: Microservices/DeliveryMicroservice/build/test-results/integrationTest/*.xml
    paths:
      - Microservices/DeliveryMicroservice/build/reports/tests/
    expire_in: 1 week

# AssistantService needs pgvector (the vector type + cosine operator), so its side-car is the
# pgvector image rather than stock postgres:16. Runs the tenant-isolation + authorization *IT; the
# live retrieval eval (RetrievalEvalIT) is gated off by RUN_LIVE_EVAL and never runs here.
integration-test-backend-assistant:
  <<: *gradle-service
  stage: integration-test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    SERVICE: AssistantService
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    POSTGRES_DB: assistant_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_HOST_AUTH_METHOD: trust
    IT_DB_URL: "jdbc:postgresql://postgres:5432/assistant_test"
    IT_DB_USER: test
    IT_DB_PASS: test
  before_script:
    - cd Microservices/AssistantService
    - until bash -c "echo > /dev/tcp/postgres/5432" 2>/dev/null; do sleep 1; done
  script:
    - gradle integrationTest
  artifacts:
    when: always
    reports:
      junit: Microservices/AssistantService/build/test-results/integrationTest/*.xml
    paths:
      - Microservices/AssistantService/build/reports/tests/
    expire_in: 1 week

# ── 3b. ERP ADAPTER — Odoo integration tests, two versions ───────────────────
# The suite already targets both ends of the supported range (V16 and V19): if the connector
# holds on the oldest and the newest, the versions between are covered by construction. What
# it never had was a place to run — the job used to be `when: manual` with `allow_failure`,
# which is a test nobody runs and a failure nobody sees.
#
# Side-cars instead of Docker-in-Docker: the runner is not privileged, and `services:` needs
# no special rights. Two Odoo instances share one Postgres, each with its own database.
#
# Runs when the connector changes, and only then. Odoo initialises `sale` + `stock` on first
# boot, which costs minutes — too slow to sit in front of every commit. But tying it to the
# adapter's own files means it fires exactly when it can catch something, instead of on a clock
# that has no relationship to the risk.
integration-test-erp-adapter-odoo:
  stage: integration-test
  tags: [docker]
  image: gradle:8.5-jdk17
  rules:
    - changes:
        - Microservices/ErpAdapterService/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"      # still runnable on demand from the UI
  services:
    - name: postgres:16
      alias: odoo-db
    # The database host goes through HOST/USER/PASSWORD, not --db_host: Odoo's entrypoint builds
    # its own connection arguments from those variables and appends them *after* the command, so
    # command-line values are silently overridden by the defaults (host "db", which resolves to
    # nothing here). `command` is left to do only what the entrypoint will not — create and
    # populate the database. Without that, Odoo serves the database-manager screen and every test
    # fails on authentication instead of on anything meaningful.
    - name: odoo:16
      alias: odoo16
      variables:
        HOST: odoo-db
        USER: odoo
        PASSWORD: odoo
      command: ["odoo", "-d", "odoo16", "-i", "base,sale,stock", "--without-demo=all"]
    - name: odoo:19
      alias: odoo19
      variables:
        HOST: odoo-db
        USER: odoo
        PASSWORD: odoo
      command: ["odoo", "-d", "odoo19", "-i", "base,sale,stock", "--without-demo=all"]
  variables:
    # Without this the runner uses legacy container links, which connect each service to the job
    # and to nothing else. Odoo then cannot reach the database at all: it retries forever, never
    # opens its HTTP port, and the only visible symptom is a name that resolves and never answers.
    # A build-scoped network puts the services on one network so they can talk to each other.
    FF_NETWORK_PER_BUILD: "true"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    POSTGRES_USER: odoo
    POSTGRES_PASSWORD: odoo
    POSTGRES_HOST_AUTH_METHOD: trust
    # The tests default to localhost:8069 / :8070 to match the local docker-compose. In CI the
    # side-cars answer to their alias, so both are redirected here — no test code knows it is
    # running in CI.
    ODOO_V16_URL: "http://odoo16:8069/jsonrpc"
    ODOO_V16_DB: odoo16
    ODOO_V19_URL: "http://odoo19:8069/jsonrpc"
    ODOO_V19_DB: odoo19
  before_script:
    - cd Microservices/ErpAdapterService
    # Services all start at once, with no ordering and no health gate, so Odoo may well reach a
    # Postgres that is not listening yet. Waiting on the HTTP endpoint covers both: it only
    # answers once Odoo has finished creating its database.
    - |
      # Wait for what the tests actually need — an authenticated session on the target database —
      # rather than for the HTTP port. Odoo answers /web/login within seconds by serving the
      # database-manager screen, long before `-i base,sale,stock` has produced anything usable, so
      # the port is a proxy that reports ready while every test is still doomed to fail.
      # `authenticate` returns a numeric uid once the database exists and its modules are loaded.
      rpc() {  # rpc <host> <service> <method> <args-json>
        wget -qO- --timeout=10 --header='Content-Type: application/json' \
          --post-data="{\"jsonrpc\":\"2.0\",\"method\":\"call\",\"params\":{\"service\":\"$2\",\"method\":\"$3\",\"args\":$4}}" \
          "http://$1:8069/jsonrpc" 2>/dev/null | tr -d ' '
      }
      for host in odoo16 odoo19; do
        echo "waiting for $host"
        ready=""
        stable=0
        for i in $(seq 1 60); do   # 60 × 10 s = 10 min de plafond
          # Three gates, each added after the previous one proved insufficient.
          #
          # 1. Authentication. The port alone answers within seconds by serving the database-manager
          #    screen, long before `-i base,sale,stock` has produced anything usable.
          #
          # 2. Both modules report `installed`. Odoo accepts a login as soon as `base` is in place,
          #    while `sale` and `stock` are still installing — and the tests touch stock.move.line
          #    first.
          #
          # 3. A real query on the model the tests use, succeeding CONSECUTIVELY. This is the gate
          #    that was missing: once modules are marked installed, Odoo rebuilds its registry and
          #    recycles its workers. During that window it accepts connections and drops them, which
          #    reaches the tests as EOFException — an IO error, on Odoo 16 only, on the first calls
          #    of the suite. "Marked installed" is a database state; being able to serve a business
          #    model, twice in a row, is the thing the tests actually need.
          auth=$(rpc "$host" common authenticate "[\"$host\",\"admin\",\"admin\",{}]")
          uid=$(printf '%s' "$auth" | sed -n 's/.*"result":\([0-9][0-9]*\).*/\1/p')
          if [ -n "$uid" ]; then
            mods=$(rpc "$host" object execute_kw \
              "[\"$host\",$uid,\"admin\",\"ir.module.module\",\"search_count\",[[[\"name\",\"in\",[\"sale\",\"stock\"]],[\"state\",\"=\",\"installed\"]]]]")
            case "$mods" in
              *'"result":2'*)
                probe=$(rpc "$host" object execute_kw \
                  "[\"$host\",$uid,\"admin\",\"stock.move.line\",\"search_count\",[[]]]")
                case "$probe" in
                  *'"result":'*)
                    stable=$((stable + 1))
                    if [ "$stable" -ge 3 ]; then
                      ready="yes"; echo "  $host ready after ${i}0s (registry stable)"; break
                    fi
                    ;;
                  *) stable=0 ;;   # une coupure remet le compteur à zéro
                esac
                ;;
            esac
          fi
          if [ $((i % 12)) = 0 ]; then
            echo "  ${i}0s — $host: auth=${auth:-none} modules=${mods:-none} stable=$stable"
          fi
          sleep 10
        done
        [ -n "$ready" ] || { echo "$host never became stable — auth=${auth:-none} modules=${mods:-none} stable=$stable"; exit 1; }
      done
  script:
    # The whole suite, on both versions — 28 tests, no filter. They earn the two-version setup by
    # pinning what actually differs: stock.move.line.qty_done versus quantity, create_returns
    # versus action_create_returns, and the confirmation wizards, which differ most of all.
    #
    # The workflow suites used to be excluded here for needing "an instance seeded with reserved
    # stock". That was never the obstacle — the fixture stocks its own products. They failed
    # because they drove Odoo's wizards the way an RPC caller assumes rather than the way the web
    # client does, and each of those mistakes fails *silently*: the transfer stays `assigned` and
    # nothing anywhere raises. See OdooTestDataFactory.settleValidationWizards.
    - gradle integrationTest --no-daemon
  artifacts:
    when: always
    reports:
      junit: Microservices/ErpAdapterService/build/test-results/integrationTest/*.xml
    paths:
      - Microservices/ErpAdapterService/build/reports/tests/
    expire_in: 1 week

# ── 4. PACKAGE ───────────────────────────────────────────────────────────────
# Build once, deploy many: the artefact that ships is the image built here, never a rebuild
# on the server. The runner is not privileged, so this uses rootless BuildKit rather than
# Docker-in-Docker — and rather than Kaniko, whose upstream repository was archived in 2025.
#
# Tagging, in order of what you should actually deploy:
#   <service>:<short-sha>     immutable, one commit, one image — this is what a deploy pins to
#   <service>:<branch-slug>   moving pointer, convenient for "the current main"
#   <service>:<git-tag>       only when the commit carries a tag, e.g. v1.2.0
#
# There is deliberately no `latest`. A tag that silently changes meaning is how two machines
# end up "on the same version" while running different code.
.buildkit: &buildkit
  stage: package
  tags: [docker]
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  # Malgré --no-daemon, Gradle forke un démon à usage unique quand les options JVM demandées ne
  # correspondent pas à la JVM courante, ce qui est le cas par défaut. Ce démon survit parfois de
  # quelques instants à la fin du RUN, et runc échoue alors à supprimer le cgroup du conteneur :
  # « device or resource busy ». Le build a réussi, l'étape de démontage a perdu la course.
  #
  # script_failure et non runner_system_failure : buildctl rend 1, donc GitLab classe l'échec parmi
  # les erreurs de script. Contrepartie assumée : une vraie erreur de compilation sera rejouée deux
  # fois avant d'être signalée.
  retry:
    max: 2
    when: script_failure
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$NAME"
      NAMES="$IMAGE:$CI_COMMIT_SHORT_SHA,$IMAGE:$CI_COMMIT_REF_SLUG"
      [ -n "$CI_COMMIT_TAG" ] && NAMES="$NAMES,$IMAGE:$CI_COMMIT_TAG"
      echo "building $NAMES"
      # The four Java services build from Microservices/ rather than their own folder, because the
      # composite build reaches a sibling module (asm-tenant-core). Their Dockerfile still lives in
      # the service folder, so the two paths are no longer the same — DOCKERFILE_DIR falls back to
      # CONTEXT for everything else.
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$CONTEXT" \
        --local dockerfile="${DOCKERFILE_DIR:-$CONTEXT}" \
        --opt build-arg:CACHE_BUST="$CI_COMMIT_SHA" \
        --import-cache type=registry,ref=$IMAGE:buildcache \
        --export-cache type=registry,ref=$IMAGE:buildcache,mode=max \
        --output type=image,\"name=$NAMES\",push=true
  rules:
    # The default branch and release tags are what anyone deploys, so those always produce an
    # image. Feature branches can still ask for one by hand when a VPS needs to try something.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

package-images:
  <<: *buildkit
  parallel:
    matrix:
      - NAME: api-gateway
        CONTEXT: Microservices/ApiGateway
      - NAME: app-backend
        CONTEXT: Microservices
        DOCKERFILE_DIR: Microservices/AppBackend
      - NAME: delivery-service
        CONTEXT: Microservices
        DOCKERFILE_DIR: Microservices/DeliveryMicroservice
      - NAME: driver-service
        CONTEXT: Microservices
        DOCKERFILE_DIR: Microservices/DriverService
      - NAME: erp-adapter
        CONTEXT: Microservices
        DOCKERFILE_DIR: Microservices/ErpAdapterService
      - NAME: assistant-service
        CONTEXT: Microservices
        DOCKERFILE_DIR: Microservices/AssistantService
      - NAME: admin-app
        CONTEXT: Apps/admin-app-react

# ── 5. PAGES ─────────────────────────────────────────────────────────────────
# La documentation technique publiée sur GitLab Pages, reconstruite à chaque commit sur la branche
# par défaut. Elle vit dans le dépôt (docs/ + mkdocs.yml) : la publication n'est qu'un rendu, jamais
# une source — l'ancienne documentation vivait dans un dossier ignoré par git, et se perdait à chaque
# changement de machine.
#
# L'image squidfunk déclare `mkdocs` comme entrypoint ; il faut le neutraliser, sinon le `script`
# devient `mkdocs mkdocs build`.
#
# --strict fait échouer le job sur un lien mort ou une référence orpheline : une documentation qui
# ment sur ses propres liens n'a pas à être publiée.
pages:
  stage: package
  tags: [docker]
  image:
    name: squidfunk/mkdocs-material:latest
    entrypoint: [""]
  variables:
    # MkDocs lit site_url depuis cette variable (voir mkdocs.yml). CI_PAGES_URL est fournie par
    # GitLab et porte le sous-chemin réel du projet.
    SITE_URL: $CI_PAGES_URL
  # Rien à récupérer des étapes précédentes. Sans cette ligne, le job télécharge les rapports de
  # tests JUnit et les rapports HTML de l'étape d'intégration, qu'il n'ouvre jamais.
  dependencies: []
  # Expose l'URL dans l'interface : un bouton « View deployment » apparaît sur le job et sur la
  # pipeline. C'est la façon la plus simple de retrouver le lien sans aller le chercher dans
  # Deploy → Pages.
  environment:
    name: documentation
    url: $CI_PAGES_URL
  script:
    - mkdocs build --strict --site-dir public
    - echo "Documentation publiée sur $CI_PAGES_URL"
  artifacts:
    # Nommé pour que le ZIP téléchargé soit identifiable une fois sur le disque.
    name: "asm-track-documentation-$CI_COMMIT_SHORT_SHA"
    paths:
      - public
    # Six mois, et non une semaine : tant que GitLab Pages n'est pas activé sur l'instance, cet
    # artefact EST le mode de livraison. Une expiration à une semaine rendrait une pipeline
    # ancienne inutilisable au moment où on en aurait besoin.
    expire_in: 6 months
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── 6. DEPLOY ────────────────────────────────────────────────────────────────
# Le VPS ne compile rien : il tire les images déjà construites par `package-images` et redémarre les
# sept services applicatifs. Le déploiement ne touche donc ni aux sources, ni au `.env`, ni aux
# volumes — la configuration du serveur lui appartient et lui survit.
#
# Manuel, y compris sur la branche par défaut. Un déploiement qui part tout seul sur chaque commit
# est une bonne idée sur un service sans état ; ici la démonstration tourne sur cette machine, et
# c'est une personne qui doit décider du moment.
#
# Variables à définir dans Settings → CI/CD → Variables :
#   VPS_SSH_KEY   type File, clé privée sans passphrase, autorisée sur le compte de déploiement
#   VPS_HOST      192.168.10.76
#   VPS_USER      asm
#
# PRÉREQUIS SUR LE VPS — sans quoi le `docker pull` échoue :
# le serveur résout par 8.8.8.8 et voit donc l'adresse publique de git.asmtechtn.com, qui ne mène
# pas au registre. Le registre est sur le LAN. Il faut donc, une fois pour toutes :
#   echo "192.168.10.90 git.asmtechtn.com registry.asmtechtn.com" | sudo tee -a /etc/hosts
deploy-vps:
  stage: deploy
  tags: [docker]
  # Deux déploiements simultanés recréeraient les mêmes conteneurs en s'entrelaçant, et le perdant
  # laisserait le serveur dans un état qu'aucun des deux jobs ne décrit. GitLab les sérialise.
  resource_group: vps
  image: alpine:3.20
  # Rien à récupérer des étapes précédentes : ce job ne fait que piloter le VPS par SSH.
  dependencies: []
  # Ne dépend QUE des images. Sans cette ligne, le job attend la fin de tous les stages précédents,
  # y compris `pages` qui n'a rien à voir avec un déploiement. Avec elle, le bouton apparaît dès que
  # les sept images sont poussées.
  needs:
    - job: package-images
      artifacts: false
  environment:
    name: vps
    url: https://asm-track.asmtechtn.com
  variables:
    VPS_PATH: /home/asm/asm/Microservices
    # Uniquement les services applicatifs. Postgres, Keycloak, RabbitMQ, MinIO et OSRM sont
    # délibérément absents : les tirer rejouerait leurs tags flottants, et une mise à jour
    # silencieuse de MinIO a déjà rendu son volume illisible.
    DEPLOY_SERVICES: "api-gateway app-backend delivery-service driver-service erp-adapter assistant-service admin-app"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # VPS_SSH_KEY est attendue en type File — GitLab écrit alors la clé dans un fichier temporaire
    # et la variable porte son chemin. Mais en type Variable elle porte la clé elle-même, et le `cp`
    # d'origine recevait la clé comme chemin : il échouait en RECOPIANT LA CLÉ PRIVÉE DANS LE LOG.
    # Les deux formes sont donc acceptées ici, et la redirection vers /dev/null garantit qu'aucune
    # branche ne peut faire fuiter le secret, quelle que soit l'erreur.
    - |
      if [ -f "$VPS_SSH_KEY" ]; then
        cp "$VPS_SSH_KEY" ~/.ssh/id_deploy 2>/dev/null
      else
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy 2>/dev/null
      fi
      chmod 600 ~/.ssh/id_deploy
      # Une clé tronquée ou mal collée doit échouer ici, avec un message clair, plutôt que trente
      # lignes plus bas sur un « Permission denied » qui n'explique rien.
      ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1 \
        || { echo "VPS_SSH_KEY invalide : format non reconnu (retour à la ligne final manquant ?)"; exit 1; }
    # La clé d'hôte est relevée au vol : le VPS est sur le LAN et son empreinte n'est pas publiée.
    # StrictHostKeyChecking reste actif ensuite, donc un changement d'hôte fera échouer le job.
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # La surcouche est copiée à chaque déploiement : elle vit dans le dépôt, donc le serveur ne peut
    # pas dériver silencieusement de ce que décrit le commit déployé.
    - scp -i ~/.ssh/id_deploy Microservices/docker-compose.registry.yml "$VPS_USER@$VPS_HOST:$VPS_PATH/"
    # La configuration nginx du serveur n'existait QUE sur la machine distante : le bloc /files y
    # avait été ajouté à la main, sans trace dans aucun commit, et une réinstallation l'aurait
    # effacé sans que rien ne le signale. Elle est désormais reposée depuis le dépôt à chaque
    # déploiement, donc le serveur ne peut plus diverger de ce que décrit le commit déployé.
    #
    # Le fichier est déposé sous le nom que le compose du VPS monte aujourd'hui (nginx.conf). Ce nom
    # est historique : le contenu, lui, est bien nginx/prod.conf du dépôt. Renommer le montage côté
    # serveur est possible plus tard, et sans urgence — ce qui comptait était d'arrêter la dérive.
    - scp -i ~/.ssh/id_deploy Apps/admin-app-react/nginx/prod.conf "$VPS_USER@$VPS_HOST:$VPS_PATH/../Apps/admin-app-react/nginx.conf"
    # Le corps du script part en heredoc PROTÉGÉ (<<'REMOTE') : sans les quotes, `$(...)` et les
    # accolades Go de `docker inspect` seraient évalués par le runner au lieu du serveur. Les seules
    # valeurs venant de GitLab sont passées en variables d'environnement sur la ligne de commande.
    - |
      ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
        "VPS_PATH='$VPS_PATH' SERVICES='$DEPLOY_SERVICES' REG_HOST='$CI_REGISTRY' \
         REG_USER='$CI_REGISTRY_USER' REG_PASS='$CI_REGISTRY_PASSWORD' \
         REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' DEPLOY_TAG='$CI_COMMIT_SHORT_SHA' sh -s" <<'REMOTE'
      set -eu
      cd "$VPS_PATH"
      COMPOSE="docker compose -f docker-compose.yml -f docker-compose.registry.yml"

      # Le tag actuellement en service, relevé AVANT de le remplacer. Sans cette ligne, revenir en
      # arrière demande de retrouver le SHA précédent dans l'historique des pipelines, au pire
      # moment pour le chercher.
      PREV=$(docker inspect -f '{{.Config.Image}}' admin-app 2>/dev/null || echo inconnu)
      echo "Image en service avant deploiement : $PREV"

      echo "$REG_PASS" | docker login -u "$REG_USER" --password-stdin "$REG_HOST"
      export REGISTRY_IMAGE DEPLOY_TAG
      $COMPOSE pull $SERVICES

      # UN SERVICE À LA FOIS, et non les sept d'un coup.
      #
      # `--no-deps` empêche compose de démarrer les services liés NON demandés, mais quand on lui
      # passe les sept ensemble il applique quand même les `depends_on` entre eux : api-gateway
      # attend delivery-service et driver-service sains, admin-app attend api-gateway. Il suffit
      # alors qu'un service Java démarre quelques secondes trop lentement pour que compose abandonne
      # — et il abandonne AVANT admin-app, donc plus rien n'écoute sur 443. Deux déploiements ont
      # mis le site hors ligne ainsi, chaque fois pour un service qui était sain juste après.
      #
      # Avec un seul service par appel, aucune dépendance n'est évaluée. L'ordre va des services
      # métier vers la porte d'entrée, pour que la fenêtre pendant laquelle la gateway pointe vers
      # un backend qui redémarre soit la plus courte possible.
      for s in app-backend delivery-service driver-service erp-adapter assistant-service api-gateway admin-app; do
        case " $SERVICES " in
          *" $s "*) echo "-> $s"; $COMPOSE up -d --no-deps --no-build "$s" ;;
        esac
      done
      docker logout "$REG_HOST" > /dev/null 2>&1 || true

      # Attente active : un conteneur « started » n'est pas un service qui répond. On tolère jusqu'à
      # cinq minutes, ce qui couvre le démarrage des services Java sur cette machine.
      echo "Attente des services..."
      i=0
      while [ $i -lt 60 ]; do
        BAD=""
        for s in $SERVICES; do
          st=$(docker inspect -f '{{.State.Status}}:{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$s" 2>/dev/null || echo "absent:none")
          case "$st" in
            running:healthy|running:none) ;;
            *) BAD="$BAD $s($st)" ;;
          esac
        done
        [ -z "$BAD" ] && break
        i=$((i + 1))
        sleep 5
      done

      if [ -n "$BAD" ]; then
        echo "ECHEC — services non sains :$BAD"
        echo "Retour arriere : DEPLOY_TAG=<tag precedent> $COMPOSE up -d --no-deps --no-build $SERVICES"
        echo "Image precedente : $PREV"
        exit 1
      fi

      # Test de fumée : la seule preuve qui compte est que la porte d'entrée répond réellement.
      CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 https://localhost/ || echo 000)
      if [ "$CODE" != "200" ]; then
        echo "ECHEC — les conteneurs tournent mais https://localhost/ repond $CODE"
        echo "Image precedente : $PREV"
        exit 1
      fi

      # Chaque deploiement laisse derriere lui les images de l'ancien tag. Sept images par
      # deploiement remplissent le disque en une dizaine de tours, et Docker echoue alors sur des
      # erreurs qui n'ont plus rien a voir avec le deploiement.
      #
      # `prune -f` sans `-a` : seules les images ORPHELINES partent. Les images taguees des
      # deploiements precedents restent, et c'est deliberé — ce sont elles qui rendent un retour
      # arriere possible. `-a` les supprimerait et transformerait chaque incident en reconstruction.
      docker image prune -f > /dev/null 2>&1 || true

      echo "OK — 7 services sains, la console repond 200."
      REMOTE
    - echo "Déployé — $CI_COMMIT_SHORT_SHA sur $VPS_HOST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
