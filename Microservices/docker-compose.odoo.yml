# ──────────────────────────────────────────────────────────────
# ODOO SOURCE — QueryOdoo + MappingOdoo
#
# Requires: docker-compose.shared.yml
# Client vars expected in --env-file:
#   ODOO_URL, ODOO_DB, ODOO_UID, ODOO_PASSWORD
#   DB_NAME, WAREHOUSE_*, SYNC_INTERVAL_MS
# ──────────────────────────────────────────────────────────────

services:

  odoo-query:
    build:
      context: ./OdooMapping/QueryOdoo
      dockerfile: Dockerfile
    container_name: odoo-query
    ports:
      - "3100:3100"
    environment:
      NODE_ENV:      production
      PORT:          "3100"
      ODOO_URL:      ${ODOO_URL}
      ODOO_DB:       ${ODOO_DB}
      ODOO_UID:      ${ODOO_UID}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
    restart: unless-stopped
    networks:
      - pfe-network

  odoo-mapper:
    build:
      context: ./OdooMapping/MappingOdoo
      dockerfile: Dockerfile
    container_name: odoo-mapper
    ports:
      - "3300:3300"
    environment:
      NODE_ENV:           production
      PORT:               "3300"
      ODOO_QUERY_URL:     http://odoo-query:3100
      SYNC_INTERVAL_MS:   ${SYNC_INTERVAL_MS:-30000}
      DB_HOST:            postgres
      DB_PORT:            "5432"
      DB_USER:            mapper
      DB_PASSWORD:        mapper
      DB_NAME:            ${DB_NAME}
      RABBITMQ_URL:       amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE:  delivery.events
      WAREHOUSE_NAME:         ${WAREHOUSE_NAME}
      WAREHOUSE_FULL_ADDRESS: ${WAREHOUSE_FULL_ADDRESS}
      WAREHOUSE_CITY:         ${WAREHOUSE_CITY}
      WAREHOUSE_POSTAL_CODE:  ${WAREHOUSE_POSTAL_CODE}
      WAREHOUSE_COUNTRY_CODE: ${WAREHOUSE_COUNTRY_CODE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      odoo-query:
        condition: service_started
    restart: unless-stopped
    networks:
      - pfe-network

networks:
  pfe-network:
