# ──────────────────────────────────────────────────────────────
# SHARED INFRASTRUCTURE — PostgreSQL + RabbitMQ
#
# Always start this file first.
# Usage example:
#   docker compose \
#     -f docker-compose.shared.yml \
#     -f docker-compose.odoo.yml \
#     -f docker-compose.shopify.yml \
#     --env-file clients/clientA.env \
#     up -d
# ──────────────────────────────────────────────────────────────

services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - pfe-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: mapper-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER:     mapper
      POSTGRES_PASSWORD: mapper
      POSTGRES_DB:       mapper
    volumes:
      - mapper-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pfe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mapper-pgdata:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  pfe-network:
