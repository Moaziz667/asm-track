server:
  port: 8089

spring:
  application:
    name: auth-server

# Admin DB (postgres-app) — for admin/dispatcher/manager users
app-datasource:
  url: ${APP_DB_URL:jdbc:postgresql://localhost:5435/app_db}
  username: ${APP_DB_USER:app_user}
  password: ${APP_DB_PASS:app_password}

# Driver DB (postgres-driver) — for driver users
driver-datasource:
  url: ${DRIVER_DB_URL:jdbc:postgresql://localhost:5437/driver_db}
  username: ${DRIVER_DB_USER:driver}
  password: ${DRIVER_DB_PASS:driver}

auth:
  # Reproducible RSA key pair seed — change to rotate all tokens
  rsa-seed: ${AUTH_RSA_SEED:asm-rsa-key-seed-2026-change-in-prod}

  # Access token expiry in seconds
  access-token-expiry: ${AUTH_ACCESS_EXPIRY:3600}
  # Refresh token expiry in seconds
  refresh-token-expiry: ${AUTH_REFRESH_EXPIRY:604800}

  # Service-to-service clients (client_id → secret)
  clients:
    delivery-service: ${CLIENT_SECRET_DELIVERY:y7eQdSIGGdYkVmSqYWnwkLL5md3Kc3dHpKUUEKBZHrs=}
    driver-service:   ${CLIENT_SECRET_DRIVER:7gc13nP8d87F3MzGZxT5qV8qtjqnkPTpKEQwdhjCkAk=}
    erp-adapter:      ${CLIENT_SECRET_ERP:Kketonr5sYVCKsczgHGkMxMTCCQINnOYotiLfLc7vUQ=}
    app-backend:      ${CLIENT_SECRET_APP:IJz0vvMLEKLsZmahqEepTjoCRcutWyGm4IEL4iE5IY4=}
    api-gateway:      ${CLIENT_SECRET_GW:R+tyDEgIMwkVMBpsHmTfLG79q/r3shZ3OAwu0cSQhfA=}

logging:
  level:
    com.asm.auth: INFO
