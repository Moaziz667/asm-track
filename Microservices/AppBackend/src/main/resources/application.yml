# Tenant-aware log context (MDC keys set by TenantContextFilter / TenantIterator / AMQP inbound)
logging:
  pattern:
    level: "%5p [cid:%X{companyId:-},rid:%X{requestId:-}]"

server:
  port: 8080

spring:
  application:
    name: app-backend-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs}
      # Service-to-service auth: client_credentials registration used by Feign clients.
      client:
        registration:
          asm-svc:
            provider: asm-keycloak
            authorization-grant-type: client_credentials
            client-id: ${CLIENT_ID:app-backend}
            client-secret: ${CLIENT_SECRET}
        provider:
          asm-keycloak:
            token-uri: ${AUTH_SERVER_URL:http://keycloak:8080/auth/realms/asm}/protocol/openid-connect/token

  # Host/credentials supplied via SPRING_RABBITMQ_* env vars (see docker-compose).
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # This service consumes iam.commands.q, so it needs the same failure policy as the other
        # consumers. Without this block it fell back to Spring's defaults — 3 attempts, a flat 1s
        # apart, and requeue-on-reject, which loops a poison message forever instead of sending it
        # to the dead-letter queue where it is visible and replayable.
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 5
          multiplier: 2.0
          max-interval: 30000ms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:app_backend_db}
    username: ${DB_USER:app_backend}
    password: ${DB_PASS:app_backend}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema, as in DeliveryMicroservice and DriverService. It replaced a
  # spring.sql.init block that ran schema.sql with continue-on-error: true — meaning a failed
  # CREATE TABLE was swallowed and the service started on an incomplete schema.
  #
  # baseline-on-migrate lets Flyway adopt the schemas that already exist rather than refuse them.
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

app:
  cookie:
    secure: ${COOKIE_SECURE:false}

auth:
  server:
    url: ${AUTH_SERVER_URL:http://keycloak:8080/auth/realms/asm}
  issuer:
    url: ${AUTH_ISSUER_URL:${auth.server.url}}
  client:
    id: ${CLIENT_ID:app-backend}
    secret: ${CLIENT_SECRET}

odoo:
  url: ${ODOO_URL:http://host.docker.internal:8069/jsonrpc}
  db: ${ODOO_DB:odoo}
  uid: ${ODOO_UID:2}
  password: ${ODOO_PASSWORD:admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

delivery:
  service:
    url: ${DELIVERY_SERVICE_URL:http://delivery-service:8082}

driver:
  service:
    url: ${DRIVER_SERVICE_URL:http://driver-service:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized


# Paths that may legitimately arrive without an X-Company-Id. Every other /api/ route is rejected
# without one (fail-closed) — see asm-tenant-core, TenantContextFilter.
asm:
  tenant:
    tenant-less-prefixes: /api/v1/auth/
