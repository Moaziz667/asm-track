server:
  port: 8080

spring:
  application:
    name: app-backend-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:app_backend_db}
    username: ${DB_USER:app_backend}
    password: ${DB_PASS:app_backend}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

app:
  jwt:
    secret: ${JWT_SECRET:asmsecret2026}
    access-expiry-ms: ${APP_JWT_ACCESS_EXPIRY_MS:3600000}
  # PROD: set COOKIE_SECURE=true when the admin app is served over HTTPS
  cookie:
    secure: ${COOKIE_SECURE:false}

odoo:
  url: ${ODOO_URL:http://host.docker.internal:8069/jsonrpc}
  db: ${ODOO_DB:odoo}
  uid: ${ODOO_UID:2}
  password: ${ODOO_PASSWORD:admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

delivery:
  service:
    url: ${DELIVERY_SERVICE_URL:http://delivery-service:8082}

internal:
  secret: ${INTERNAL_SECRET:asm-internal-2026}
