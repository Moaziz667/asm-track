server:
  port: 8080

spring:
  application:
    name: app-backend-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:app_backend_db}
    username: ${DB_USER:app_backend}
    password: ${DB_PASS:app_backend}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

app:
  cookie:
    secure: ${COOKIE_SECURE:false}

auth:
  server:
    url: ${AUTH_SERVER_URL:http://auth-server:8089}
    jwks-uri: ${AUTH_SERVER_JWKS_URI:http://auth-server:8089/oauth2/jwks}
  client:
    id: ${CLIENT_ID:app-backend}
    secret: ${CLIENT_SECRET:IJz0vvMLEKLsZmahqEepTjoCRcutWyGm4IEL4iE5IY4=}

odoo:
  url: ${ODOO_URL:http://host.docker.internal:8069/jsonrpc}
  db: ${ODOO_DB:odoo}
  uid: ${ODOO_UID:2}
  password: ${ODOO_PASSWORD:admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

delivery:
  service:
    url: ${DELIVERY_SERVICE_URL:http://delivery-service:8082}

