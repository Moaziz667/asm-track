plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.asm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springCloudVersion = '2023.0.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
    implementation 'org.flywaydb:flyway-core'
    // Schema-per-tenant plumbing, shared with the other services (see docs/adr/001).
    implementation 'com.asm:asm-tenant-core:1.0.0'

	// Service-to-service: declarative HTTP clients + OAuth2 client_credentials token management
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// Async messaging (ERP sync commands in, results out)
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// Observability + resilience (actuator already present above)
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	// Integration tests — Testcontainers
	testImplementation 'org.testcontainers:testcontainers:1.20.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testImplementation 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	exclude '**/integration/**'
}

tasks.register('integrationTest', Test) {
	useJUnitPlatform()
	include '**/integration/**'
}

// Couverture de code — mesuree par JaCoCo a chaque execution de `test`.
//
// Le CSV est le seul des trois formats qui se resume en une ligne de shell : la chaine d'integration
// en tire le pourcentage d'instructions couvertes et le donne a GitLab, qui l'affiche sur le job et
// sur la pipeline. Le XML sert a la visualisation ligne a ligne dans les demandes de fusion. Le HTML
// est desactive : personne ne l'ouvre depuis un runner, et c'est le plus couteux a produire.
jacocoTestReport {
	// `test` et `integrationTest` s'executent dans deux jobs distincts et deposent chacun leur
	// fichier .exec dans build/jacoco. Les agreger donne la couverture reelle du service : mesurer
	// les seuls tests unitaires sur l'integralite du code la sous-estime lourdement, puisque tout
	// ce que verifient les tests d'integration est alors compte comme non couvert.
	executionData.setFrom(fileTree(layout.buildDirectory.get().asFile).include("jacoco/*.exec"))
	reports {
		csv.required = true
		xml.required = true
		html.required = false
	}
}

// `finalizedBy` et non `dependsOn` : le rapport est produit APRES les tests, y compris quand ils
// echouent. Une campagne rouge est justement celle dont on veut connaitre la couverture.
tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}
