# Tenant-aware log context (MDC keys set by TenantContextFilter / TenantIterator / AMQP inbound)
logging:
  pattern:
    level: "%5p [cid:%X{companyId:-},rid:%X{requestId:-}]"

server:
  port: 8088

spring:
  application:
    name: erp-adapter-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/realms/asm/protocol/openid-connect/certs}
      # Service-to-service auth: client_credentials registration used by Feign clients.
      client:
        registration:
          asm-svc:
            provider: asm-keycloak
            authorization-grant-type: client_credentials
            client-id: ${CLIENT_ID:erp-adapter}
            client-secret: ${CLIENT_SECRET}
        provider:
          asm-keycloak:
            token-uri: ${AUTH_SERVER_URL:http://keycloak:8080/realms/asm}/protocol/openid-connect/token
  # Host/credentials supplied via SPRING_RABBITMQ_* env vars (see docker-compose).
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          # Same policy as DeliveryMicroservice and DriverService: 5 attempts, so 4 waits of
          # 2s, 4s, 8s, 16s — 30s in total before the command dead-letters. This service used to
          # start at 3s, which made it the only consumer with its own timing for no stated reason.
          initial-interval: 2000ms
          max-attempts: 5
          multiplier: 2.0
          max-interval: 30000ms
  datasource:
    url: jdbc:h2:file:${ERP_DB_PATH:/data/erp_adapter_db};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  # Flyway owns the schema, as in the three other services. It replaced ddl-auto: update, which
  # never dropped or renamed anything and left no history on a persistent store holding each
  # tenant's ERP field mappings and sync cursors.
  #
  # validate, not none: Hibernate no longer touches the schema but still refuses to start if the
  # migration and the entities disagree — the one guarantee update was quietly providing.
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

# ── Odoo Connection ──────────────────────────────────────────────────────────
odoo:
  url:      ${ODOO_URL:http://odoo:8069/jsonrpc}
  db:       ${ODOO_DB:odoo}
  username: ${ODOO_USERNAME:admin}
  password: ${ODOO_PASSWORD:admin}
  uid:      ${ODOO_UID:1}

  # Timeouts for Odoo JSON-RPC calls.
  # connect-ms: max time to establish TCP with Odoo (5s)
  # read-ms:    max time to wait for Odoo response (15s — stock ops can be slow)
  timeout:
    connect-ms: ${ODOO_CONNECT_TIMEOUT_MS:5000}
    read-ms:    ${ODOO_READ_TIMEOUT_MS:15000}

# ── Auth Server ──────────────────────────────────────────────────────────────


auth:
  server:
    url: ${AUTH_SERVER_URL:http://keycloak:8080/realms/asm}
  client:
    id: ${CLIENT_ID:erp-adapter}
    secret: ${CLIENT_SECRET}

delivery:
  service:
    url: ${DELIVERY_SERVICE_URL:http://delivery-service:8082}

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# V2 — Odoo→ASM inbound sync (polling)
erp:
  inbound:
    poll:
      enabled: ${ERP_INBOUND_POLL_ENABLED:true}
      fixed-delay-ms: ${ERP_INBOUND_POLL_DELAY_MS:600000}   # 10 min safety net

# POD photo fetch. Media is stored as a bare object key, so the bucket is needed to build the
# internal MinIO URL; the public base only serves to rewrite legacy absolute URLs.
minio:
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  internal-url: ${MINIO_INTERNAL_URL:http://minio:9000}
  bucket: ${MINIO_BUCKET:pod-files}
