services:

  #  OSRM ROUTING (self-hosted)
  osrm-download:
    image: curlimages/curl:8.11.1
    container_name: osrm-download
    user: "0:0"
    command: >
      sh -ec 'mkdir -p /data; if [ ! -f /data/tunisia-latest.osm.pbf ]; then curl -fL https://download.geofabrik.de/africa/tunisia-latest.osm.pbf -o /data/tunisia-latest.osm.pbf; fi'
    volumes:
      - osrm-data:/data
    restart: "no"
    profiles: ["init"]
    networks:
      - asm-network

  osrm-prepare:
    image: osrm/osrm-backend:latest
    container_name: osrm-prepare
    command: >
      sh -ec "
      osrm-extract -p /opt/car.lua --threads 1 /data/tunisia-latest.osm.pbf &&
      osrm-partition --threads 1 /data/tunisia-latest.osrm &&
      osrm-customize --threads 1 /data/tunisia-latest.osrm
      "
    volumes:
      - osrm-data:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["init"]
    networks:
      - asm-network

  osrm:
    image: osrm/osrm-backend:latest
    container_name: osrm
    command: osrm-routed --algorithm mld /data/tunisia-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm-data:/data
    restart: unless-stopped
    networks:
      - asm-network

  #  RABBITMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  KEYCLOAK IAM
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASS}
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASS}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # This container has no mem limit, so Keycloak's image-default heap sizing
      # (-XX:MaxRAMPercentage=70) is computed against the whole ~2G Docker VM → the build/augment JVM
      # tries to reserve ~1.4G heap, which the oversubscribed VM can't grant → the kernel OOM-kills the
      # build, leaving a truncated quarkus-application.dat that fails every later start-dev (EOFException).
      # Pin a fixed, modest heap that fits so the build completes deterministically.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Client secrets injected for realm JSON interpolation
      CLIENT_SECRET_APP: ${CLIENT_SECRET_APP}
      CLIENT_SECRET_DELIVERY: ${CLIENT_SECRET_DELIVERY}
      CLIENT_SECRET_DRIVER: ${CLIENT_SECRET_DRIVER}
      CLIENT_SECRET_ERP: ${CLIENT_SECRET_ERP}
      CLIENT_SECRET_GW: ${CLIENT_SECRET_GW}
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Keycloakify outputs the LOGIN theme as a JAR. Deploy it as a provider so every
      # `npm run build-keycloak-theme` is picked up on the next Keycloak restart.
      - ../Apps/admin-app-react/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/asm-theme.jar:ro
      # ASM-branded ACCOUNT console theme (extends keycloak.v3, CSS + logo). Plain KC theme dir —
      # avoids pulling the PatternFly account-ui into the React 19 admin app.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8089:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  POSTGRES DATABASES
  postgres-app:
    image: postgres:16-alpine
    container_name: postgres-app
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${APP_DB_PASS}
      POSTGRES_DB: app_db
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-delivery:
    image: postgres:16-alpine
    container_name: postgres-delivery
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASS}
      POSTGRES_DB: delivery_db
    volumes:
      - delivery-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-driver:
    image: postgres:16-alpine
    container_name: postgres-driver
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_USER: driver
      POSTGRES_PASSWORD: ${DRIVER_DB_PASS}
      POSTGRES_DB: driver_db
    volumes:
      - driver-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driver -d driver_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  MINIO FILE STORAGE
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - asm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  #  CORE MICROSERVICES
  app-backend:
    build:
      context: ./AppBackend
      dockerfile: Dockerfile
    container_name: app-backend
    # ports:
    #   - "8080:8080" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-app:5432/app_db
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASS}
      KC_JWK_SET_URI: http://keycloak:8080/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/realms/asm
      AUTH_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8089/realms/asm}
      CLIENT_ID: app-backend
      CLIENT_SECRET: ${CLIENT_SECRET_APP}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      ODOO_URL: ${ODOO_URL:-http://host.docker.internal:8069/jsonrpc}
      ODOO_DB: ${ODOO_DB}
      ODOO_UID: ${ODOO_UID}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
    depends_on:
      postgres-app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  delivery-service:
    build:
      context: ./DeliveryMicroservice
      dockerfile: Dockerfile
    container_name: delivery-service
    # ports:
    #   - "8082:8082" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      SPRING_PROFILES_ACTIVE: prod
      # JVM sizing: the Java-17 default (MaxRAMPercentage=25% ≈ 128M heap under the old 512M cap) starved
      # this Spring Boot app's ~300M working set into permanent full-GCs, pegging the CPUs and making boot
      # crawl (5+ min). With OSRM out of the VM there's room, so the cap is raised to 768M (below) and the
      # heap set to a balanced ~65% (leaving ~250M for metaspace/code-cache/threads so it can't cgroup-OOM),
      # with the single-threaded collector so GC never fans out across cores. No image rebuild needed.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC"
      DB_HOST: postgres-delivery
      DB_PORT: "5432"
      DB_NAME: delivery_db
      DB_USER: delivery
      DB_PASS: ${DELIVERY_DB_PASS}
      KC_JWK_SET_URI: http://keycloak:8080/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/realms/asm
      TRUST_GATEWAY_HEADERS: ${TRUST_GATEWAY_HEADERS:-false}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      CLIENT_ID: delivery-service
      CLIENT_SECRET: ${CLIENT_SECRET_DELIVERY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      WEBSOCKET_BROKER_RELAY_ENABLED: "true"
      DRIVER_SERVICE_URL: http://driver-service:8086
      TRANSPORT_PROVIDER: internal
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
      MINIO_BUCKET: pod-files
      OPS_SLA_WAITING_MINUTES: "1"
      OPS_SLA_TRANSIT_MINUTES: "2"
      ROUTING_OSRM_ENABLED: "true"
      ROUTING_OSRM_BASE_URL: http://osrm:5000
      ROUTING_OSRM_PROFILE: driving
      ROUTING_TRANSIT_SLA_MULTIPLIER: "1.20"
      ROUTING_TRANSIT_SLA_BUFFER_MINUTES: "8"
      ERP_ADAPTER_URL: http://erp-adapter:8088
      ERP_DEFAULT_PROVIDER: odoo
      FCM_ENABLED: "true"
      FCM_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - ./DeliveryMicroservice/firebase-service-account.json:/app/firebase-service-account.json:ro
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres-delivery:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── ERP Adapter Service ────────────────────────────────────────────────────
  erp-adapter:
    build:
      context: ./ErpAdapterService
      dockerfile: Dockerfile
    container_name: erp-adapter
    # ports:
    #   - "8088:8088" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      SERVER_PORT: 8088
      KC_JWK_SET_URI: http://keycloak:8080/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/realms/asm
      CLIENT_ID: erp-adapter
      CLIENT_SECRET: ${CLIENT_SECRET_ERP}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      ERP_DB_PATH: /data/erp_adapter_db
      # POD photo fetch: rewrite the stored public MinIO URL to the internal container URL.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_INTERNAL_URL: http://minio:9000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - erp-adapter-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  driver-service:
    build:
      context: ./DriverService
      dockerfile: Dockerfile
    container_name: driver-service
    # ports:
    #   - "8086:8086" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      DB_URL: jdbc:postgresql://postgres-driver:5432/driver_db
      DB_USER: driver
      DB_PASS: ${DRIVER_DB_PASS}
      KC_JWK_SET_URI: http://keycloak:8080/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/realms/asm
      AUTH_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8089/realms/asm}
      CLIENT_ID: driver-service
      CLIENT_SECRET: ${CLIENT_SECRET_DRIVER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
    depends_on:
      postgres-driver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8086"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  API GATEWAY
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "80:80"
    environment:
      APP_BACKEND_URL: http://app-backend:8080
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      DRIVER_SERVICE_URL: http://driver-service:8086
      ERP_ADAPTER_URL: http://erp-adapter:8088
      KC_JWK_SET_URI: http://keycloak:8080/realms/asm/protocol/openid-connect/certs
      CLIENT_SECRET_GW: ${CLIENT_SECRET_GW}
      # Admin web + Flutter web dev origins. Override per env via .env (CORS_ALLOWED_ORIGINS).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:5000}
    depends_on:
      app-backend:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asm-network

  # admin-web removed — served by PM2 on port 3000 with system nginx on 8090.
  # See scripts/nginx-vps.conf and scripts/vps-setup.sh.


volumes:
  rabbitmq-data:
  app-pgdata:
  delivery-pgdata:
  driver-pgdata:
  keycloak-pgdata:
  minio_data:
  osrm-data:
  erp-adapter-data:

networks:
  asm-network:
    driver: bridge
    name: microservices_asm-network
