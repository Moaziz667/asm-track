services:

  #  OSRM ROUTING (self-hosted)
  osrm-download:
    image: curlimages/curl:8.11.1
    container_name: osrm-download
    user: "0:0"
    command: >
      sh -ec 'mkdir -p /data; if [ ! -f /data/tunisia-latest.osm.pbf ]; then curl -fL https://download.geofabrik.de/africa/tunisia-latest.osm.pbf -o /data/tunisia-latest.osm.pbf; fi'
    volumes:
      - osrm-data:/data
    restart: "no"
    profiles: ["init"]
    networks:
      - asm-network

  osrm-prepare:
    image: osrm/osrm-backend:latest
    container_name: osrm-prepare
    command: >
      sh -ec "
      osrm-extract -p /opt/car.lua --threads 1 /data/tunisia-latest.osm.pbf &&
      osrm-partition --threads 1 /data/tunisia-latest.osrm &&
      osrm-customize --threads 1 /data/tunisia-latest.osrm
      "
    volumes:
      - osrm-data:/data
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["init"]
    networks:
      - asm-network

  osrm:
    image: osrm/osrm-backend:latest
    container_name: osrm
    command: osrm-routed --algorithm mld /data/tunisia-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm-data:/data
    restart: unless-stopped
    networks:
      - asm-network

  #  RABBITMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  KEYCLOAK IAM
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASS}
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: start-dev --import-realm --features=organization
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASS}
      # Keycloak est servi derrière le nginx de l'admin-app, sous /auth. Le chemin doit être connu de
      # Keycloak lui-même, parce qu'il l'écrit dans les URLs qu'il génère : page de connexion, document
      # de découverte OIDC, redirections. Un proxy qui se contenterait de retirer le préfixe produirait
      # des liens sans /auth, cassés dès la première redirection.
      KC_HTTP_RELATIVE_PATH: /auth
      # L'origine publique est déduite des en-têtes X-Forwarded-* transmis par nginx.
      #
      # Ne PAS y substituer un KC_HOSTNAME en URL complète : ce réglage remplace le chemin au lieu de
      # s'y ajouter. Keycloak servait alors la découverte sous /auth tout en y annonçant un émetteur
      # sans /auth, le SPA suivait cette adresse, nginx y répondait par index.html au titre du repli
      # SPA, et l'application se rechargeait en boucle.
      #
      # La déduction est sans ambiguïté tant que nginx reste la seule porte d'entrée — d'où le retrait
      # du port 8089 ci-dessous. Une seconde entrée produirait un second émetteur.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # This container has no mem limit, so Keycloak's image-default heap sizing
      # (-XX:MaxRAMPercentage=70) is computed against the whole ~2G Docker VM → the build/augment JVM
      # tries to reserve ~1.4G heap, which the oversubscribed VM can't grant → the kernel OOM-kills the
      # build, leaving a truncated quarkus-application.dat that fails every later start-dev (EOFException).
      # Pin a fixed, modest heap that fits so the build completes deterministically.
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx768m"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Client secrets injected for realm JSON interpolation
      CLIENT_SECRET_APP: ${CLIENT_SECRET_APP}
      CLIENT_SECRET_DELIVERY: ${CLIENT_SECRET_DELIVERY}
      CLIENT_SECRET_DRIVER: ${CLIENT_SECRET_DRIVER}
      CLIENT_SECRET_ERP: ${CLIENT_SECRET_ERP}
      CLIENT_SECRET_GW: ${CLIENT_SECRET_GW}
      RESEND_API_KEY: ${RESEND_API_KEY}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Keycloakify outputs the LOGIN theme as a JAR. Deploy it as a provider so every
      # `npm run build-keycloak-theme` is picked up on the next Keycloak restart.
      - ../Apps/admin-app-react/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/asm-theme.jar:ro
      # ASM-branded ACCOUNT console theme (extends keycloak.v3, CSS + logo). Plain KC theme dir —
      # avoids pulling the PatternFly account-ui into the React 19 admin app.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    # Aucun port publié : Keycloak est joint par nginx sous /auth, et lui seul. Le publier rouvrirait
    # une seconde origine, donc un second émetteur dans le claim `iss`, que les services refuseraient.
    # Console d'administration : http://localhost/auth/admin
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  POSTGRES DATABASES
  postgres-app:
    image: postgres:16-alpine
    container_name: postgres-app
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${APP_DB_PASS}
      POSTGRES_DB: app_db
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-delivery:
    image: postgres:16-alpine
    container_name: postgres-delivery
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASS}
      POSTGRES_DB: delivery_db
    # Continuous WAL archiving — the business database, and the only one that gets it.
    # A nightly dump alone means an incident at 15:00 costs everything since 02:30; with the
    # journals the loss is bounded by archive_timeout instead. Keycloak and driver data barely
    # move, so they stay on the daily dump and skip the extra machinery.
    #
    # The `install` step is there because a fresh named volume is created root-owned while the
    # server writes as postgres: without it archive_command fails quietly, forever. Started as
    # root on purpose — the official entrypoint drops to postgres itself.
    command: >
      sh -c "install -d -o postgres -g postgres /wal-archive &&
      exec docker-entrypoint.sh postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
      -c archive_timeout=300"
    volumes:
      - delivery-pgdata:/var/lib/postgresql/data
      - delivery-wal-archive:/wal-archive
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-driver:
    image: postgres:16-alpine
    container_name: postgres-driver
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_USER: driver
      POSTGRES_PASSWORD: ${DRIVER_DB_PASS}
      POSTGRES_DB: driver_db
    volumes:
      - driver-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driver -d driver_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  MINIO FILE STORAGE
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - asm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  #  CORE MICROSERVICES
  app-backend:
    build:
      # Context is Microservices/, not the service folder: the build needs the sibling
      # asm-tenant-core module, which a per-service context cannot reach.
      context: .
      dockerfile: AppBackend/Dockerfile
    container_name: app-backend
    # ports:
    #   - "8080:8080" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-app:5432/app_db
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASS}
      KC_JWK_SET_URI: http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/auth/realms/asm
      AUTH_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost/auth/realms/asm}
      CLIENT_ID: app-backend
      CLIENT_SECRET: ${CLIENT_SECRET_APP}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      ODOO_URL: ${ODOO_URL:-http://host.docker.internal:8069/jsonrpc}
      ODOO_DB: ${ODOO_DB}
      ODOO_UID: ${ODOO_UID}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
    depends_on:
      postgres-app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  delivery-service:
    build:
      # Context is Microservices/, not the service folder: the build needs the sibling
      # asm-tenant-core module, which a per-service context cannot reach.
      context: .
      dockerfile: DeliveryMicroservice/Dockerfile
    container_name: delivery-service
    # ports:
    #   - "8082:8082" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      SPRING_PROFILES_ACTIVE: prod
      # JVM sizing: the Java-17 default (MaxRAMPercentage=25% ≈ 128M heap under the old 512M cap) starved
      # this Spring Boot app's ~300M working set into permanent full-GCs, pegging the CPUs and making boot
      # crawl (5+ min). With OSRM out of the VM there's room, so the cap is raised to 1.5G (below) and the
      # heap set to a balanced ~65% (leaving ~540M for metaspace/code-cache/threads so it can't cgroup-OOM),
      # with the single-threaded collector so GC never fans out across cores. No image rebuild needed.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC"
      DB_HOST: postgres-delivery
      DB_PORT: "5432"
      DB_NAME: delivery_db
      DB_USER: delivery
      DB_PASS: ${DELIVERY_DB_PASS}
      KC_JWK_SET_URI: http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/auth/realms/asm
      TRUST_GATEWAY_HEADERS: ${TRUST_GATEWAY_HEADERS:-false}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      CLIENT_ID: delivery-service
      CLIENT_SECRET: ${CLIENT_SECRET_DELIVERY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      WEBSOCKET_BROKER_RELAY_ENABLED: "true"
      DRIVER_SERVICE_URL: http://driver-service:8086
      TRANSPORT_PROVIDER: internal
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
      MINIO_BUCKET: pod-files
      OPS_SLA_WAITING_MINUTES: "1"
      OPS_SLA_TRANSIT_MINUTES: "2"
      ROUTING_OSRM_ENABLED: "true"
      ROUTING_OSRM_BASE_URL: http://osrm:5000
      ROUTING_OSRM_PROFILE: driving
      ROUTING_TRANSIT_SLA_MULTIPLIER: "1.20"
      ROUTING_TRANSIT_SLA_BUFFER_MINUTES: "8"
      ERP_ADAPTER_URL: http://erp-adapter:8088
      ERP_DEFAULT_PROVIDER: odoo
      FCM_ENABLED: "true"
      FCM_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - ./DeliveryMicroservice/firebase-service-account.json:/app/firebase-service-account.json:ro
      # Read-only, and only the state file matters: the System Health page reports when the last
      # backup ran, so a cron that stopped weeks ago is visible instead of merely silent. The
      # service must never be able to write here — it is not the thing being trusted with backups.
      - ../backups:/backups:ro
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres-delivery:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── ERP Adapter Service ────────────────────────────────────────────────────
  erp-adapter:
    build:
      # Context is Microservices/, not the service folder: the build needs the sibling
      # asm-tenant-core module, which a per-service context cannot reach.
      context: .
      dockerfile: ErpAdapterService/Dockerfile
    container_name: erp-adapter
    # ports:
    #   - "8088:8088" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      SERVER_PORT: 8088
      KC_JWK_SET_URI: http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/auth/realms/asm
      CLIENT_ID: erp-adapter
      CLIENT_SECRET: ${CLIENT_SECRET_ERP}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      ERP_DB_PATH: /data/erp_adapter_db
      # POD photo fetch: media is stored as an object key, resolved against internal MinIO.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_INTERNAL_URL: http://minio:9000
      MINIO_BUCKET: pod-files
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - erp-adapter-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  driver-service:
    build:
      # Context is Microservices/, not the service folder: the build needs the sibling
      # asm-tenant-core module, which a per-service context cannot reach.
      context: .
      dockerfile: DriverService/Dockerfile
    container_name: driver-service
    # ports:
    #   - "8086:8086" # Commented out for VPS security. Access via API Gateway instead.
    environment:
      TZ: Africa/Tunis
      DB_URL: jdbc:postgresql://postgres-driver:5432/driver_db
      DB_USER: driver
      DB_PASS: ${DRIVER_DB_PASS}
      KC_JWK_SET_URI: http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/auth/realms/asm
      AUTH_ISSUER_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost/auth/realms/asm}
      CLIENT_ID: driver-service
      CLIENT_SECRET: ${CLIENT_SECRET_DRIVER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
    depends_on:
      postgres-driver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8086"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  API GATEWAY
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    # Plus aucun port publié : la gateway est jointe par le nginx de l'admin-app sur le réseau interne.
    # Elle partageait le port 80 avec lui, ce qui rendait les deux services mutuellement exclusifs.
    environment:
      APP_BACKEND_URL: http://app-backend:8080
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      DRIVER_SERVICE_URL: http://driver-service:8086
      ERP_ADAPTER_URL: http://erp-adapter:8088
      KC_JWK_SET_URI: http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs
      CLIENT_SECRET_GW: ${CLIENT_SECRET_GW}
      # Admin web + Flutter web dev origins. Override per env via .env (CORS_ALLOWED_ORIGINS).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:5000}
    depends_on:
      app-backend:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asm-network

  # ── ADMIN WEB ──────────────────────────────────────────────────────────────
  # Point d'entrée unique. Le nginx de l'image sert le SPA et relaie /api et /ws vers la gateway,
  # /auth vers Keycloak. Le navigateur reste donc en même origine : pas de CORS, et une seule adresse
  # à retenir. L'ancienne note « servi par PM2 avec le nginx système » décrivait un déploiement manuel
  # dont les scripts n'ont jamais existé dans le dépôt.
  #
  # 80:8080 parce que l'image tourne sans privilèges et ne peut pas lier un port sous 1024.
  admin-app:
    build:
      context: ../Apps/admin-app-react
      dockerfile: Dockerfile
    container_name: admin-app
    ports:
      - "80:8080"
    depends_on:
      api-gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ── Assistant Service (RAG) ────────────────────────────────────────────────
  postgres-assistant:
    # pgvector image, NOT stock postgres:16-alpine — the extension must be present for V1__pgvector.sql.
    image: pgvector/pgvector:pg16
    container_name: postgres-assistant
    ports:
      # 5438 on the host: 5436 is postgres-odoo and 5437 is postgres-driver. In-container it is 5432.
      - "127.0.0.1:5438:5432"
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASS:-assistant}
      POSTGRES_DB: assistant_db
    volumes:
      - assistant-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - asm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  assistant-service:
    build:
      # Context is Microservices/, not the service folder: the build needs the sibling
      # asm-tenant-core module, which a per-service context cannot reach.
      context: .
      dockerfile: AssistantService/Dockerfile
    container_name: assistant-service
    # ports:
    #   - "8087:8087"  # Commented out — access via API Gateway only.
    environment:
      TZ: Africa/Tunis
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC"
      DB_HOST: postgres-assistant
      DB_PORT: "5432"
      DB_NAME: assistant_db
      DB_USER: assistant
      DB_PASS: ${ASSISTANT_DB_PASS:-assistant}
      KC_JWK_SET_URI: http://keycloak:8080/auth/realms/asm/protocol/openid-connect/certs
      AUTH_SERVER_URL: http://keycloak:8080/auth/realms/asm
      CLIENT_ID: assistant-service
      CLIENT_SECRET: ${CLIENT_SECRET_ASSISTANT:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
      DRIVER_SERVICE_URL: http://driver-service:8086
      # AI providers — keys resolved from Microservices/.env (gitignored).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # Answering provider; whichever is not selected stays wired as the automatic standby.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      INGESTION_ROOT: /corpus
    volumes:
      # The clean docs/ tree, read-only, is the knowledge corpus. Root context.md and any gitignored
      # markdown live outside this mount and so are never reachable by ingestion.
      - ../docs:/corpus:ro
    depends_on:
      postgres-assistant:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8087"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - asm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rabbitmq-data:
  app-pgdata:
  assistant-pgdata:
  delivery-pgdata:
  delivery-wal-archive:   # continuous WAL journals — see ops/backup/README.md
  driver-pgdata:
  keycloak-pgdata:
  minio_data:
  osrm-data:
  erp-adapter-data:

networks:
  asm-network:
    driver: bridge
    name: microservices_asm-network
