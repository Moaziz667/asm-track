# ──────────────────────────────────────────────────────────────
# SHOPIFY SOURCE — QueryShopify + MappingShopify
#
# Requires: docker-compose.shared.yml
# Client vars expected in --env-file:
#   SHOPIFY_STORE_URL, SHOPIFY_ACCESS_TOKEN
#   DB_NAME, WAREHOUSE_*, SYNC_INTERVAL_MS
# ──────────────────────────────────────────────────────────────

services:

  shopify-query:
    build:
      context: ./ShopifyMapping/QueryShopify
      dockerfile: Dockerfile
    container_name: shopify-query
    ports:
      - "3200:3200"
    environment:
      NODE_ENV:              production
      PORT:                  "3200"
      SHOPIFY_STORE_URL:     ${SHOPIFY_STORE_URL}
      SHOPIFY_ACCESS_TOKEN:  ${SHOPIFY_ACCESS_TOKEN}
    restart: unless-stopped
    networks:
      - pfe-network

  shopify-mapper:
    build:
      context: ./ShopifyMapping/MappingShopify
      dockerfile: Dockerfile
    container_name: shopify-mapper
    ports:
      - "3400:3400"
    environment:
      NODE_ENV:           production
      PORT:               "3400"
      SHOPIFY_QUERY_URL:  http://shopify-query:3200
      SYNC_INTERVAL_MS:   ${SYNC_INTERVAL_MS:-30000}
      DB_HOST:            postgres
      DB_PORT:            "5432"
      DB_USER:            mapper
      DB_PASSWORD:        mapper
      DB_NAME:            ${DB_NAME}
      RABBITMQ_URL:       amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE:  delivery.events
      WAREHOUSE_NAME:         ${WAREHOUSE_NAME}
      WAREHOUSE_FULL_ADDRESS: ${WAREHOUSE_FULL_ADDRESS}
      WAREHOUSE_CITY:         ${WAREHOUSE_CITY}
      WAREHOUSE_POSTAL_CODE:  ${WAREHOUSE_POSTAL_CODE}
      WAREHOUSE_COUNTRY_CODE: ${WAREHOUSE_COUNTRY_CODE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      shopify-query:
        condition: service_started
    restart: unless-stopped
    networks:
      - pfe-network

networks:
  pfe-network:
