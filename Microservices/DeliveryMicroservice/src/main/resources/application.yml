server:
  port: 8082

logging:
  level:
    com.asm.delivery.security: DEBUG

spring:
  application:
    name: delivery-service

  security:
    user:
      name: disabled
      password: disabled

  datasource:
    # PROD: set DB_HOST to your PostgreSQL server hostname/IP
    # PROD: set DB_PORT to 5432 (standard), DB_NAME to your production database name
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:delivery_db}
    # PROD: set DB_USER and DB_PASS to strong credentials (never use defaults in production)
    username: ${DB_USER:delivery}
    password: ${DB_PASS:delivery}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

app:
  jwt:
    # PROD: set JWT_SECRET to a random 64-char string — e.g. openssl rand -hex 64
    # NEVER use the default 'asmsecret2026' in production
    secret: ${JWT_SECRET:asmsecret2026}
    access-expiry-ms: 3600000     # 1 hour
    refresh-expiry-ms: 604800000  # 7 days

  origin:
    name: ${WAREHOUSE_NAME:Main Warehouse}
    address: ${WAREHOUSE_ADDRESS:123 Logistics Street}
    city: ${WAREHOUSE_CITY:Tunis}
    postal-code: ${WAREHOUSE_POSTAL_CODE:1000}
    country-code: ${WAREHOUSE_COUNTRY_CODE:TN}

  security:
    trust-gateway-headers: false
    gateway-secret: ${GATEWAY_SECRET:}
  osrm:
    # PROD: set ROUTING_OSRM_BASE_URL to your OSRM container URL e.g. http://osrm:5000
    base-url: ${ROUTING_OSRM_BASE_URL:http://localhost:5000}
  route:
    default-dwell-minutes: ${ROUTE_DEFAULT_DWELL_MINUTES:10}
  sla:
    check-interval-ms: ${SLA_CHECK_INTERVAL_MS:30000}
  
  # Configuration Ops pour les SLAs des Lanes
  ops:
    sla:
      waiting-limit-minutes: ${OPS_SLA_WAITING_LIMIT:15}
      assign-limit-minutes: ${OPS_SLA_ASSIGN_LIMIT:20}
      pickup-limit-minutes: ${OPS_SLA_PICKUP_LIMIT:20}

transport:
  provider: ${TRANSPORT_PROVIDER:internal}

driver:
  service:
    # PROD: DRIVER_SERVICE_URL defaults to Docker service name — correct if using docker-compose
    url: ${DRIVER_SERVICE_URL:http://driver-service:8086}

internal:
  # PROD: set INTERNAL_SECRET to a strong random value — shared with all microservices
  # NEVER use the default 'asm-internal-2026' in production
  secret: ${INTERNAL_SECRET:asm-internal-2026}

# ── FCM Push Notifications ──────────────────────────────────────────────────
fcm:
  # PROD: set FCM_ENABLED=true and FCM_SERVICE_ACCOUNT_PATH to your Firebase service account JSON path
  enabled: ${FCM_ENABLED:false}
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

# ── ERP Adapter ─────────────────────────────────────────────────────────────
erp:
  adapter-url: ${ERP_ADAPTER_URL:http://erp-adapter:8088}
  default-provider: ${ERP_DEFAULT_PROVIDER:odoo}

  sync:
    # Retry scheduler: exponential backoff, max 10 attempts before SYNC_FAILED
    retry:
      max-retries: ${ERP_SYNC_MAX_RETRIES:10}
      scheduler-delay-ms: ${ERP_SYNC_SCHEDULER_DELAY_MS:120000}  # every 2 minutes

    # HTTP timeouts for calls to ErpAdapterService
    # adapter is on the local docker network, so connect is fast;
    # read is generous because adapter may itself call Odoo which is slow
    timeout:
      connect-ms: ${ERP_SYNC_CONNECT_TIMEOUT_MS:3000}
      read-ms: ${ERP_SYNC_READ_TIMEOUT_MS:30000}

minio:
  # PROD: MINIO_URL = internal Docker URL e.g. http://minio:9000
  url: ${MINIO_URL:http://localhost:9000}
  # PROD: MINIO_PUBLIC_URL = externally accessible URL (from browser/driver app) e.g. https://files.yourdomain.com
  public-url: ${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}
  # PROD: set MINIO_ACCESS_KEY and MINIO_SECRET_KEY — never use defaults
  access-key: ${MINIO_ACCESS_KEY:asmtracking}
  secret-key: ${MINIO_SECRET_KEY:asmtracking2026}
  bucket: ${MINIO_BUCKET:pod-files}

routing:
  osrm:
    enabled: ${ROUTING_OSRM_ENABLED:false}
    base-url: ${ROUTING_OSRM_BASE_URL:http://osrm:5000}
    profile: ${ROUTING_OSRM_PROFILE:driving}
    connect-timeout-ms: ${ROUTING_OSRM_CONNECT_TIMEOUT_MS:1500}
    read-timeout-ms: ${ROUTING_OSRM_READ_TIMEOUT_MS:3000}
  transit-sla:
    multiplier: ${ROUTING_TRANSIT_SLA_MULTIPLIER:1.20}
    buffer-minutes: ${ROUTING_TRANSIT_SLA_BUFFER_MINUTES:8}
    min-minutes: ${ROUTING_TRANSIT_SLA_MIN_MINUTES:15}
    max-minutes: ${ROUTING_TRANSIT_SLA_MAX_MINUTES:240}

springdoc:
  # PROD: disable Swagger UI entirely — exposes all endpoints publicly
  # Set springdoc.swagger-ui.enabled=false and springdoc.api-docs.enabled=false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
