version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Delivery Microservice — docker-compose
#
#  Includes:
#    • delivery-db : dedicated PostgreSQL 16 on port 5434
#    • delivery    : the Spring Boot service on port 8082
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  delivery-db:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER:     delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB:       delivery_db
    volumes:
      - delivery-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pfe-network

  # ── Delivery Service ────────────────────────────────────────────────────────
  delivery:
    build:
      context: .
      dockerfile: Dockerfile
    image: asm/delivery-service:latest
    container_name: delivery-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      # Database
      DB_HOST:          delivery-db
      DB_PORT:          5432
      DB_NAME:          delivery_db
      DB_USER:          delivery
      DB_PASS:          delivery

      # RabbitMQ — central broker on pfe-network
      RABBITMQ_HOST:    rabbitmq
      RABBITMQ_PORT:    5672
      RABBITMQ_USER:    guest
      RABBITMQ_PASS:    guest
      APP_RABBITMQ_QUEUE_ORDERS_CREATED:   mapper.ready.canonical.queue
      APP_RABBITMQ_QUEUE_WORKFLOW_COMMANDS: workflow.commands
      APP_RABBITMQ_CONSUME_CANONICAL: "true"

      # JSON Web Token
      JWT_SECRET:       asmsecret2026

      # Odoo ERP
      ODOO_URL:         http://host.docker.internal:8069/jsonrpc
      ODOO_DB:          odoo
      ODOO_UID:         "2"
      ODOO_PASSWORD:    admin

      # Gateway security
      GATEWAY_SECRET:   asm-gateway-secret-2026

    depends_on:
      delivery-db:
        condition: service_healthy
    networks:
      - pfe-network
    labels:
      com.asm.service: "delivery"

volumes:
  delivery-pgdata:
    driver: local

networks:
  pfe-network:
    external: true
    name: pfe-network
