plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.asm'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

ext {
    springCloudVersion = '2023.0.3'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Schema-per-tenant plumbing, shared with the other services (see docs/adr/001).
    implementation 'com.asm:asm-tenant-core:1.0.0'

    // Service-to-service: declarative HTTP clients + OAuth2 client_credentials token management
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // Observability + resilience
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'com.resend:resend-java:3.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Object storage for driver profile photos (avatars) — same MinIO the other services use.
    implementation 'io.minio:minio:8.5.12'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Without this, `test` finds no JUnit engine and reports success having run nothing — a green
// tick meaning "I did not look".
tasks.named('test') {
    useJUnitPlatform()
}

// Couverture de code — mesuree par JaCoCo a chaque execution de `test`.
//
// Le CSV est le seul des trois formats qui se resume en une ligne de shell : la chaine d'integration
// en tire le pourcentage d'instructions couvertes et le donne a GitLab, qui l'affiche sur le job et
// sur la pipeline. Le XML sert a la visualisation ligne a ligne dans les demandes de fusion. Le HTML
// est desactive : personne ne l'ouvre depuis un runner, et c'est le plus couteux a produire.
jacocoTestReport {
    // `test` et `integrationTest` s'executent dans deux jobs distincts et deposent chacun leur
    // fichier .exec dans build/jacoco. Les agreger donne la couverture reelle du service : mesurer
    // les seuls tests unitaires sur l'integralite du code la sous-estime lourdement, puisque tout
    // ce que verifient les tests d'integration est alors compte comme non couvert.
    executionData.setFrom(fileTree(layout.buildDirectory).include("jacoco/*.exec"))
    reports {
        csv.required = true
        xml.required = true
        html.required = false
    }
}

// `finalizedBy` et non `dependsOn` : le rapport est produit APRES les tests, y compris quand ils
// echouent. Une campagne rouge est justement celle dont on veut connaitre la couverture.
tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}
