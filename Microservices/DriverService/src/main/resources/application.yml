# Tenant-aware log context (MDC keys set by TenantContextFilter / TenantIterator / AMQP inbound)
logging:
  pattern:
    level: "%5p [cid:%X{companyId:-},rid:%X{requestId:-}]"

server:
  port: 8086

spring:
  application:
    name: driver-service

  # Global pagination guardrails — cap any Pageable controller arg (driver history, admin lists).
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  # Host/credentials are supplied via SPRING_RABBITMQ_* env vars (see docker-compose).
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 5
          multiplier: 2.0
          max-interval: 30000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/realms/asm/protocol/openid-connect/certs}
      # Service-to-service auth: client_credentials registration used by Feign clients.
      client:
        registration:
          asm-svc:
            provider: asm-keycloak
            authorization-grant-type: client_credentials
            client-id: ${CLIENT_ID:driver-service}
            client-secret: ${CLIENT_SECRET}
        provider:
          asm-keycloak:
            token-uri: ${AUTH_SERVER_URL:http://keycloak:8080/realms/asm}/protocol/openid-connect/token

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/driver_db}
    username: ${DB_USER:driver}
    password: ${DB_PASS:driver}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # Flyway owns the schema now (moved off ddl-auto:update so tenant schemas can be
  # provisioned identically to delivery/appbackend). Baseline = V1__baseline.sql.
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Driver avatar uploads (phone photos can exceed the 1MB default).
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  # Default driver seed disabled: multi-tenant, seed manually per tenant.
  sql:
    init:
      mode: never

minio:
  # Internal Docker URL for the client; PUBLIC_URL is what the browser/app loads avatars from.
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:asmtracking}
  secret-key: ${MINIO_SECRET_KEY:asmtracking}

appbackend:
  service:
    # AppBackend is the sole Keycloak owner; used for the synchronous driver-onboarding password set.
    url: ${APPBACKEND_SERVICE_URL:http://app-backend:8080}

resend:
  api-key: ${RESEND_API_KEY:re_placeholder}
  from: onboarding@resend.dev

invite:
  ttl-hours: 48
  resend-cooldown-seconds: 60

auth:
  server:
    url: ${AUTH_SERVER_URL:http://keycloak:8080/realms/asm}
  issuer:
    url: ${AUTH_ISSUER_URL:${auth.server.url}}
  client:
    id: ${CLIENT_ID:driver-service}
    secret: ${CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# Paths that may legitimately arrive without an X-Company-Id. Every other /api/ route is rejected
# without one (fail-closed) — see asm-tenant-core, TenantContextFilter.
asm:
  tenant:
    tenant-less-prefixes: /api/v1/auth/
