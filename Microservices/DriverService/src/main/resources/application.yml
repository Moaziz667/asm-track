server:
  port: 8086

spring:
  application:
    name: driver-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/realms/asm/protocol/openid-connect/certs}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/driver_db}
    username: ${DB_USER:driver}
    password: ${DB_PASS:driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      continue-on-error: true

resend:
  api-key: ${RESEND_API_KEY:re_placeholder}
  from: onboarding@resend.dev

invite:
  ttl-hours: 48
  resend-cooldown-seconds: 60

auth:
  server:
    url: ${AUTH_SERVER_URL:http://keycloak:8080/realms/asm}
  client:
    id: ${CLIENT_ID:driver-service}
    secret: ${CLIENT_SECRET:changeme}
