# ASM-branded admin console — extends Keycloak's native v2 admin console (PatternFly).
# The stock admin console renders light regardless of OS/app theme; this theme forces the
# PatternFly dark mode (via a small script that sets the theme class on <html>) plus a CSS
# color-scheme hint, so the admin console matches the rest of ASM Track's dark UI.
parent=keycloak.v2
import=common/keycloak

styles=css/dark.css
scripts=js/force-dark.js
