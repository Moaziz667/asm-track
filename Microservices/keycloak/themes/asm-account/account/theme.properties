# ASM-branded account console — extends Keycloak's native v3 account console (PatternFly 5),
# so we keep ALL features (password, 2FA, sessions, devices) and just restyle via CSS variables
# + swap the logo. No React/PatternFly pulled into the admin app => no React 19 conflict.
parent=keycloak.v3
import=common/keycloak

styles=css/asm.css
scripts=js/asm.js

# Browser-tab favicon: replace Keycloak's default with the ASM mark (resolved under resourceUrl).
favIcon=/img/icon.png
favIconType=image/png
