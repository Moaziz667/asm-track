# Tenant-aware log context (MDC keys set by TenantContextFilter).
logging:
  pattern:
    level: "%5p [cid:%X{companyId:-},rid:%X{requestId:-}]"

server:
  port: 8087

spring:
  application:
    name: assistant-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/realms/asm/protocol/openid-connect/certs}
      # Service-to-service auth for the Phase 4 read-only live tools (client_credentials).
      client:
        registration:
          asm-svc:
            provider: asm-keycloak
            authorization-grant-type: client_credentials
            client-id: ${CLIENT_ID:assistant-service}
            client-secret: ${CLIENT_SECRET:}
        provider:
          asm-keycloak:
            token-uri: ${AUTH_SERVER_URL:http://keycloak:8080/realms/asm}/protocol/openid-connect/token

  # Host/credentials supplied via SPRING_RABBITMQ_* / RABBITMQ_* env vars (see docker-compose).
  # Used by the shared tenant AMQP post-processors and, from Phase 2, ingestion/audit events.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:assistant_db}
    username: ${DB_USER:assistant}
    password: ${DB_PASS:assistant}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema (pgvector + rag_* tables), as in DeliveryMicroservice/AppBackend.
  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

# Every /api/ route on the assistant is tenant-scoped: no tenant-less prefixes → fail-closed.
asm:
  tenant:
    tenant-less-prefixes:

# AI providers, isolated behind ports (EmbeddingPort / LlmPort). Keys come from the environment only
# — never committed. Changing the embedding model changes the vector dimension → new Flyway migration.
assistant:
  # Corpus ingestion. Root is the mounted docs/ tree (read-only); run-on-startup is for local
  # bring-up / CI fixtures, production ingestion is triggered via POST /api/assistant/admin/ingest.
  ingestion:
    root: ${INGESTION_ROOT:/corpus}
    run-on-startup: ${INGESTION_ON_STARTUP:false}
  chunking:
    max-chars: 2000
    overlap-chars: 150
  # Retrieval: fetch top-K per strategy, fuse with RRF, keep top-N for the context budget.
  retrieval:
    top-k: 20
    top-n: 6
    rrf-k: 60
  context:
    char-budget: 8000
  # LLM behind LlmPort. Reuses GEMINI_API_KEY. Bounded timeout + retry on 429/503; on failure the
  # orchestrator returns a controlled "degraded" answer, never a hallucination.
  llm:
    # Which provider answers first; the other is the automatic standby (see FailoverLlmAdapter).
    # `openai` picks the OpenAI-compatible adapter below — OpenRouter by default, but the same
    # adapter serves Groq, Hugging Face's router or a local Ollama by changing base-url + model.
    provider: ${LLM_PROVIDER:gemini}
    model: ${GEMINI_MODEL:gemini-flash-latest}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    # Any provider speaking OpenAI's /chat/completions. Left unconfigured (no key) it is simply
    # skipped, so a Gemini-only deployment is unchanged.
    openai:
      api-key: ${OPENROUTER_API_KEY:}
      # gpt-oss-20b rather than Gemma: the free Gemma tier is served from Google AI Studio's shared
      # pool — the very quota the Gemini adapter already saturates, so it is no fallback at all.
      model: ${OPENROUTER_MODEL:openai/gpt-oss-20b:free}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    temperature: 0.2
    max-output-tokens: 1024
    timeout-ms: 20000
    max-retries: 2
  # Read-only live tools (Delivery/Driver). Short timeout; failures degrade, never fabricate.
  tools:
    timeout-ms: 5000
  # Per-(tenant+user) sliding window — answering is costly/abusable, so cap it. In-process, no infra.
  ratelimit:
    max-requests: 30
    window-seconds: 60
  # Default provider is Gemini (gemini-embedding-001 @ outputDimensionality=1536, matching vector(1536)),
  # reusing the one GEMINI_API_KEY. Set provider=openai + EMBEDDING_* to switch back to OpenAI.
  embedding:
    provider: ${EMBEDDING_PROVIDER:gemini}
    model: ${EMBEDDING_MODEL:gemini-embedding-001}
    dimension: ${EMBEDDING_DIMENSION:1536}
    base-url: ${EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${EMBEDDING_API_KEY:${GEMINI_API_KEY:}}

# Downstream services for the Phase 4 read-only tools.
delivery:
  service:
    url: ${DELIVERY_SERVICE_URL:http://delivery-service:8082}
driver:
  service:
    url: ${DRIVER_SERVICE_URL:http://driver-service:8086}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
