plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.asm'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

ext {
    springCloudVersion = '2023.0.3'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Aggregated Swagger UI at the gateway (reactive/webflux flavour) — pulls each service's OpenAPI spec.
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.6.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Couverture de code — mesuree par JaCoCo a chaque execution de `test`.
//
// Le CSV est le seul des trois formats qui se resume en une ligne de shell : la chaine d'integration
// en tire le pourcentage d'instructions couvertes et le donne a GitLab, qui l'affiche sur le job et
// sur la pipeline. Le XML sert a la visualisation ligne a ligne dans les demandes de fusion. Le HTML
// est desactive : personne ne l'ouvre depuis un runner, et c'est le plus couteux a produire.
jacocoTestReport {
    reports {
        csv.required = true
        xml.required = true
        html.required = false
    }
}

// `finalizedBy` et non `dependsOn` : le rapport est produit APRES les tests, y compris quand ils
// echouent. Une campagne rouge est justement celle dont on veut connaitre la couverture.
tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}
