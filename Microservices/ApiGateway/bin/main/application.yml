server:
  port: 80

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: app-backend-client-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/client/**

        - id: app-backend-profile
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/profile/**

        - id: odoo-products
          uri: ${ODOO_QUERY_URL:http://localhost:3100}
          predicates:
            - Path=/api/products
            - Path=/api/products/**

        - id: app-backend-dispatcher-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/dispatcher/**

        - id: app-backend-admin-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/admin/**

        - id: app-backend-manager-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/manager/**

        - id: driver-auth
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/auth/driver/**

        - id: app-backend-admin-clients
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/admin/clients/**

        - id: app-backend-admin-users
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/admin/users/**

        - id: delivery-admin
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/deliveries/**

        - id: delivery-admin-erp
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/erp/**

        - id: delivery-admin-routes
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/routes/**

        - id: delivery-admin-vehicles
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/vehicles/**

        - id: delivery-admin-reports
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/reports/**

        - id: delivery-admin-ops
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/ops/**

        - id: delivery-admin-stats
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/stats/**

        - id: delivery-admin-audit
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/audit/**

        - id: delivery-admin-search
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/search

        - id: delivery-admin-companies
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/companies/**

        - id: delivery-admin-fleet
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/fleet/**

        - id: driver-admin
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/admin/drivers/**

        - id: delivery-v1-depots
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/depots/**

        - id: delivery-v1-zones
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/zones/**

        - id: delivery-ws
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/ws/**

        - id: delivery-orders
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/orders/**

        - id: delivery-deliveries
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/deliveries/**

        - id: delivery-driver-deliveries
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/driver/deliveries/**

        - id: delivery-driver-routes
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/driver/routes/**

        - id: driver-service
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/driver/**

        - id: internal-app-backend
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/internal/users/**

        - id: internal-app-backend-admin-users
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/internal/admin-users/**

        - id: internal-driver-service
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/internal/drivers/**

        - id: delivery-public-tracking
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/public/**

app:
  jwt:
    secret: ${JWT_SECRET:asmsecret2026}

logging:
  level:
    org.springframework.cloud.gateway: INFO