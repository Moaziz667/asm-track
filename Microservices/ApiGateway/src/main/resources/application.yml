server:
  port: 80

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/realms/asm/protocol/openid-connect/certs}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - RemoveRequestHeader=X-User-Role
        - RemoveRequestHeader=X-User-Id
        - RemoveRequestHeader=X-App-User-Id
        - RemoveRequestHeader=X-Dominant-Role
      routes:
        # ADR-033/images — public file proxy: browser & phone reach MinIO through the single gateway
        # origin instead of a hardcoded LAN IP. /files/pod-files/x → strip /files → minio/pod-files/x.
        - id: minio-files
          uri: ${MINIO_URL:http://minio:9000}
          predicates:
            - Path=/files/**
          filters:
            - StripPrefix=1

        # AssistantService (RAG). Authenticated route → the gateway injects X-Company-Id from the
        # JWT org_id, so tenant isolation reaches the assistant exactly as it reaches the other services.
        - id: assistant-service
          uri: ${ASSISTANT_SERVICE_URL:http://assistant-service:8087}
          predicates:
            - Path=/api/assistant/**

        - id: app-backend-client-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/client/**

        - id: app-backend-profile
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/profile/**

        - id: app-backend-settings
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/settings/**

        - id: odoo-products
          uri: ${ODOO_QUERY_URL:http://localhost:3100}
          predicates:
            - Path=/api/v1/products
            - Path=/api/v1/products/**

        - id: app-backend-dispatcher-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/dispatcher/**

        - id: app-backend-admin-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/admin/**

        - id: app-backend-manager-auth
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/auth/manager/**

        - id: driver-auth
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/auth/driver/**

        - id: app-backend-admin-clients
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/clients/**

        - id: app-backend-admin-users
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/users/**

        - id: app-backend-admin-me
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/v1/admin/me/**,/api/v1/admin/me

        - id: delivery-admin
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/deliveries/**

        - id: delivery-admin-returns
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/returns/**

        - id: delivery-admin-cash
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/cash/**

        - id: delivery-admin-handoffs
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/handoffs/**

        - id: delivery-admin-notifications
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/notifications/**

        - id: delivery-admin-failure-reasons
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/failure-reasons/**

        - id: delivery-admin-system
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/system/**

        - id: delivery-admin-erp
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/erp/**

        - id: delivery-admin-routes
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/routes/**

        - id: delivery-admin-vehicles
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/vehicles/**

        - id: delivery-admin-reports
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/reports/**

        - id: delivery-admin-ops
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/ops/**

        - id: delivery-admin-stats
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/stats/**

        - id: delivery-admin-audit
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/audit/**

        - id: delivery-admin-search
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/search

        - id: delivery-admin-companies
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/companies/**

        - id: delivery-admin-fleet
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/fleet/**

        - id: driver-admin
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/admin/drivers/**

        - id: delivery-v1-depots
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/depots/**

        - id: delivery-v1-zones
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/zones/**

        - id: delivery-ws
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/ws/**

        - id: delivery-orders
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**

        - id: delivery-deliveries
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/deliveries/**

        - id: delivery-driver-deliveries
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/driver/deliveries/**

        - id: delivery-driver-routes
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/driver/routes/**

        - id: delivery-driver-handoffs
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/driver/handoffs/**

        - id: delivery-driver-vehicles
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/driver/vehicles/**

        - id: driver-service
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/driver/**

        # NOTE: /internal/** routes intentionally REMOVED. They are service-to-service endpoints;
        # every Feign client calls the services directly on the container network, and exposing them
        # through the public gateway made the internal surface internet-reachable (guarded only by
        # the SERVICE-role JWT check in each service). Do not re-add without network-level restriction.

        - id: delivery-public-tracking
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/public/**

        # OpenAPI — proxy each service's /v3/api-docs so the gateway's Swagger UI aggregates them all
        # behind the single gateway origin (dropdown per service).
        - id: openapi-delivery
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/delivery
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-driver
          uri: ${DRIVER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/driver
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-app-backend
          uri: ${APP_BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/v3/api-docs/app-backend
          filters:
            - SetPath=/v3/api-docs

# Aggregated API documentation, served by the gateway at /swagger-ui.html.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: delivery-service
        url: /v3/api-docs/delivery
      - name: driver-service
        url: /v3/api-docs/driver
      - name: app-backend
        url: /v3/api-docs/app-backend

logging:
  level:
    org.springframework.cloud.gateway: INFO