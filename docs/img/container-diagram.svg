<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-internal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="400" fill="#f8fafc" rx="8"/>

  <!-- ── CLIENTS ── -->
  <rect x="10" y="80" width="120" height="240" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="70" y="72" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">Clients</text>
  <!-- Admin App -->
  <rect x="22" y="100" width="96" height="34" rx="17" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="122" text-anchor="middle" font-size="11" fill="#1e293b">Admin App</text>
  <!-- Super Admin -->
  <rect x="22" y="148" width="96" height="34" rx="17" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="170" text-anchor="middle" font-size="11" fill="#1e293b">Super Admin</text>
  <!-- Driver App -->
  <rect x="22" y="196" width="96" height="34" rx="17" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="218" text-anchor="middle" font-size="11" fill="#1e293b">Driver App</text>

  <!-- Arrow: Clients -> Gateway -->
  <line x1="130" y1="200" x2="192" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="161" y="193" text-anchor="middle" font-size="9" fill="#64748b">HTTPS</text>

  <!-- ── API GATEWAY ── -->
  <rect x="194" y="160" width="110" height="80" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="249" y="196" text-anchor="middle" font-size="12" fill="white" font-weight="700">API Gateway</text>
  <text x="249" y="213" text-anchor="middle" font-size="10" fill="white">port 80</text>

  <!-- Arrows: Gateway -> Services -->
  <line x1="304" y1="178" x2="366" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="304" y1="200" x2="366" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="304" y1="222" x2="366" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── MICROSERVICES BOX ── -->
  <rect x="360" y="20" width="380" height="360" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="550" y="14" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">Microservices</text>

  <!-- AppBackend -->
  <rect x="375" y="80" width="165" height="48" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="457" y="101" text-anchor="middle" font-size="11" fill="white" font-weight="600">AppBackend</text>
  <text x="457" y="118" text-anchor="middle" font-size="10" fill="#bfdbfe">port 8080</text>
  <!-- DB AppBackend -->
  <ellipse cx="590" cy="92" rx="30" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="560" y="92" width="60" height="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <ellipse cx="590" cy="116" rx="30" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="108" text-anchor="middle" font-size="9" fill="#475569">postgres-app</text>
  <line x1="540" y1="104" x2="560" y2="104" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow-internal)"/>

  <!-- DeliveryMicroservice -->
  <rect x="375" y="168" width="165" height="48" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="457" y="188" text-anchor="middle" font-size="10" fill="white" font-weight="600">DeliveryMicroservice</text>
  <text x="457" y="205" text-anchor="middle" font-size="10" fill="#bfdbfe">port 8082</text>
  <!-- DB Delivery -->
  <ellipse cx="590" cy="180" rx="30" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="560" y="180" width="60" height="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <ellipse cx="590" cy="204" rx="30" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="196" text-anchor="middle" font-size="9" fill="#475569">postgres-dl</text>
  <line x1="540" y1="192" x2="560" y2="192" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow-internal)"/>

  <!-- DriverService -->
  <rect x="375" y="256" width="165" height="48" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="457" y="276" text-anchor="middle" font-size="11" fill="white" font-weight="600">DriverService</text>
  <text x="457" y="293" text-anchor="middle" font-size="10" fill="#bfdbfe">port 8086</text>
  <!-- DB Driver -->
  <ellipse cx="590" cy="268" rx="30" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="560" y="268" width="60" height="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <ellipse cx="590" cy="292" rx="30" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="284" text-anchor="middle" font-size="9" fill="#475569">postgres-drv</text>
  <line x1="540" y1="280" x2="560" y2="280" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow-internal)"/>

  <!-- ErpAdapterService -->
  <rect x="375" y="335" width="165" height="30" rx="6" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="457" y="351" text-anchor="middle" font-size="10" fill="white" font-weight="600">ErpAdapterService :8088</text>
  <!-- DB H2 -->
  <ellipse cx="590" cy="342" rx="20" ry="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="570" y="342" width="40" height="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <ellipse cx="590" cy="358" rx="20" ry="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="354" text-anchor="middle" font-size="9" fill="#475569">H2</text>
  <line x1="540" y1="350" x2="570" y2="350" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow-internal)"/>

  <!-- Internal arrow: Delivery -> ErpAdapter -->
  <line x1="457" y1="216" x2="457" y2="335" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-internal)"/>
  <text x="470" y="278" font-size="9" fill="#94a3b8">ERP sync</text>

  <!-- ── EXTERNAL ── -->
  <rect x="760" y="60" width="140" height="280" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="830" y="54" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">External</text>

  <!-- Odoo/DUX -->
  <rect x="773" y="80" width="114" height="44" rx="6" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <text x="830" y="99" text-anchor="middle" font-size="11" fill="white" font-weight="600">Odoo / DUX</text>
  <text x="830" y="114" text-anchor="middle" font-size="9" fill="#d1d5db">ERP</text>

  <!-- MinIO -->
  <rect x="773" y="172" width="114" height="44" rx="6" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <text x="830" y="196" text-anchor="middle" font-size="11" fill="white" font-weight="600">MinIO</text>
  <text x="830" y="211" text-anchor="middle" font-size="9" fill="#d1d5db">Object Storage</text>

  <!-- OSRM -->
  <rect x="773" y="264" width="114" height="44" rx="6" fill="#6b7280" stroke="#4b5563" stroke-width="1.5"/>
  <text x="830" y="288" text-anchor="middle" font-size="11" fill="white" font-weight="600">OSRM</text>
  <text x="830" y="303" text-anchor="middle" font-size="9" fill="#d1d5db">Route Engine</text>

  <!-- Arrows: ErpAdapter -> Odoo -->
  <line x1="740" y1="350" x2="760" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: Delivery -> MinIO, OSRM -->
  <line x1="740" y1="192" x2="773" y2="194" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="188" text-anchor="middle" font-size="9" fill="#64748b">S3</text>
  <line x1="740" y1="192" x2="773" y2="286" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="248" text-anchor="middle" font-size="9" fill="#64748b">HTTP</text>

</svg>